#@ load("@ytt:overlay", "overlay")
#@overlay/match by=overlay.all
---
paths:
  #@overlay/match missing_ok=True
  /entityTypes:
    get:
      operationId: GetEntityTypes
      x-formkiq-required-permission: READ_ENTITY
      tags:
        - Entity
      description: |-
        Returns a list of entity types.

        Requires READ_ENTITY for both CUSTOM and PRESET namespaces.
      summary: Get EntityTypes
      parameters:
        - $ref: '#/components/parameters/siteIdParam'
        - $ref: '#/components/parameters/namespaceParam'
        - $ref: '#/components/parameters/nextParam'
        - $ref: '#/components/parameters/limitParam'
      responses:
        '200':
          description: "200 OK"
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
            Access-Control-Allow-Methods:
              $ref: '#/components/headers/AccessControlAllowMethods'
            Access-Control-Allow-Headers:
              $ref: '#/components/headers/AccessControlAllowHeaders'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GetEntityTypesResponse"
      security:
      - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/lambdaApi200"
    post:
      operationId: AddEntityType
      description: |-
        Creates an entity type.

        Requires WRITE_RETENTION_POLICY for the PRESET RetentionPolicy type,
        WRITE_REMINDER_POLICY for the PRESET ReminderPolicy type, or WRITE_ENTITY
        for other types. The dedicated preset permission replaces the generic entity
        permission; WRITE_ENTITY alone does not authorize either dedicated preset.
        The preset is identified by the namespace and name in the request body.
      summary: Add New EntityType
      x-formkiq-required-permission: WRITE_ENTITY
      x-formkiq-required-permission-by-preset:
        RetentionPolicy: WRITE_RETENTION_POLICY
        ReminderPolicy: WRITE_REMINDER_POLICY
      tags:
        - Entity
      parameters:
        - $ref: '#/components/parameters/siteIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddEntityTypeRequest'
      responses:
        '201':
          description: 201 CREATED
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
            Access-Control-Allow-Methods:
              $ref: '#/components/headers/AccessControlAllowMethods'
            Access-Control-Allow-Headers:
              $ref: '#/components/headers/AccessControlAllowHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddEntityTypeResponse'
        '400':
          description: 400 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorsResponse'
      security:
      - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/lambdaApi201"

  #@overlay/match missing_ok=True
  /entityTypes/{entityTypeId}:
    get:
      operationId: GetEntityType
      x-formkiq-required-permission: READ_ENTITY
      x-formkiq-required-permission-by-preset:
        RetentionPolicy: READ_RETENTION_POLICY
        ReminderPolicy: READ_REMINDER_POLICY
      tags:
        - Entity
      description: |-
        Returns an entity type.

        Requires READ_RETENTION_POLICY for the PRESET RetentionPolicy type,
        READ_REMINDER_POLICY for the PRESET ReminderPolicy type, or READ_ENTITY
        for other types. The dedicated preset permission replaces the generic entity
        permission; READ_ENTITY alone does not authorize either dedicated preset.
        The preset is identified by its stored namespace and name, whether the request
        identifies the entity type by name or UUID. A CUSTOM type with the same name
        continues to use the generic entity permission.
      summary: Get EntityType
      parameters:
        - $ref: '#/components/parameters/siteIdParam'
        - $ref: '#/components/parameters/entityTypeIdParam'
        - $ref: '#/components/parameters/namespaceParam'
      responses:
        '200':
          description: "200 OK"
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
            Access-Control-Allow-Methods:
              $ref: '#/components/headers/AccessControlAllowMethods'
            Access-Control-Allow-Headers:
              $ref: '#/components/headers/AccessControlAllowHeaders'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GetEntityTypeResponse"
      security:
      - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/lambdaApi200"
    put:
      operationId: SetEntityType
      description: |-
        Sets an entity type.

        Existing PRESET entity type names cannot be changed, including when
        createIfMissing=true. CUSTOM entity types can be renamed.

        Requires WRITE_RETENTION_POLICY for the PRESET RetentionPolicy type,
        WRITE_REMINDER_POLICY for the PRESET ReminderPolicy type, or WRITE_ENTITY
        for other types. The dedicated preset permission replaces the generic entity
        permission; WRITE_ENTITY alone does not authorize either dedicated preset.
        Existing types use their stored namespace and name. When creating a missing
        type, the namespace and name in the request body determine the permission.
        Updating an existing type must not bypass its current permission requirement.
      summary: Set EntityType
      x-formkiq-required-permission: WRITE_ENTITY
      x-formkiq-required-permission-by-preset:
        RetentionPolicy: WRITE_RETENTION_POLICY
        ReminderPolicy: WRITE_REMINDER_POLICY
      tags:
        - Entity
      parameters:
        - $ref: '#/components/parameters/siteIdParam'
        - $ref: '#/components/parameters/entityTypeIdParam'
        - $ref: '#/components/parameters/createIfMissingParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetEntityTypeRequest'
      responses:
        '200':
          description: 200 OK
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
            Access-Control-Allow-Methods:
              $ref: '#/components/headers/AccessControlAllowMethods'
            Access-Control-Allow-Headers:
              $ref: '#/components/headers/AccessControlAllowHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetResponse'
        '400':
          description: 400 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorsResponse'
      security:
      - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/lambdaApi200"
    delete:
      operationId: DeleteEntityType
      description: |-
        Deletes an entity type.

        Requires DELETE_RETENTION_POLICY for the PRESET RetentionPolicy type,
        DELETE_REMINDER_POLICY for the PRESET ReminderPolicy type, or DELETE_ENTITY
        for other types. The dedicated preset permission replaces the generic entity
        permission; DELETE_ENTITY alone does not authorize either dedicated preset.
        The preset is identified by its stored namespace and name, whether the request
        identifies the entity type by name or UUID. A CUSTOM type with the same name
        continues to use the generic entity permission.
      summary: Deletes Entity Type
      x-formkiq-required-permission: DELETE_ENTITY
      x-formkiq-required-permission-by-preset:
        RetentionPolicy: DELETE_RETENTION_POLICY
        ReminderPolicy: DELETE_REMINDER_POLICY
      tags:
        - Entity
      parameters:
        - $ref: '#/components/parameters/siteIdParam'
        - $ref: '#/components/parameters/entityTypeIdParam'
      responses:
        '200':
          $ref: '#/components/responses/200CorsDeleteResponse'
      security:
      - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/lambdaApi200"

  #@overlay/match missing_ok=True
  /entities/{entityTypeId}:
    get:
      operationId: GetEntities
      x-formkiq-required-permission: READ_ENTITY
      x-formkiq-required-permission-by-preset:
        RetentionPolicy: READ_RETENTION_POLICY
        ReminderPolicy: READ_REMINDER_POLICY
      tags:
        - Entity
      description: |-
        Returns a list of entities.

