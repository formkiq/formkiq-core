      description: |-
        Deletes an entity.

        Requires DELETE_RETENTION_POLICY for the PRESET RetentionPolicy type,
        DELETE_REMINDER_POLICY for the PRESET ReminderPolicy type, or DELETE_ENTITY
        for other types. The dedicated preset permission replaces the generic entity
        permission; DELETE_ENTITY alone does not authorize either dedicated preset.
        The preset is identified by its stored namespace and name, whether the request
        identifies the entity type by name or UUID. A CUSTOM type with the same name
