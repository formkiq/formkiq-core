      x-formkiq-required-permission: DELETE_ENTITY
      x-formkiq-required-permission-by-preset:
        RetentionPolicy: DELETE_RETENTION_POLICY
        ReminderPolicy: DELETE_REMINDER_POLICY
      tags:
        - Entity
      parameters:
        - $ref: '#/components/parameters/siteIdParam'
        - $ref: '#/components/parameters/entityTypeIdParam'
        - $ref: '#/components/parameters/entityIdParam'
      responses:
        '200':
          $ref: '#/components/responses/200CorsDeleteResponse'
      security:
      - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/lambdaApi200"

  #@overlay/match missing_ok=True
  /entities/{entityTypeId}/{entityId}/attributes/{attributeKey}:
    delete:
      operationId: DeleteEntityAttribute
      description: |-
        Deletes an entity attribute. Requires DELETE_ENTITY. Attributes cannot be
        removed from PRESET entities, including RetentionPolicy and ReminderPolicy.
      summary: Deletes Entity Attribute
      x-formkiq-required-permission: DELETE_ENTITY
      tags:
      - Entity
      parameters:
      - $ref: '#/components/parameters/siteIdParam'
      - $ref: '#/components/parameters/entityTypeIdParam'
      - $ref: '#/components/parameters/entityIdParam'
      - $ref: '#/components/parameters/attributeKeyParam'
      responses:
        "200":
          $ref: '#/components/responses/200CorsDeleteResponse'
      security:
      - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: '#/components/x-amazon-apigateway-integrations/lambdaApi200'

components:
  schemas:
    #@overlay/match missing_ok=True
    AddEntityResponse:
      type: "object"
      properties:
        entityId:
          type: "string"
          description: "Entity Identifier"

    #@overlay/match missing_ok=True
    AddEntityTypeResponse:
      type: "object"
      properties:
        entityTypeId:
          type: "string"
          description: "Entity Type Identifier"

    #@overlay/match missing_ok=True
    GetEntitiesResponse:
      type: "object"
      properties:
        next:
          type: "string"
          description: "Next page of results token"
        entities:
          type: "array"
          description: "List of Entities"
          items:
            $ref: "#/components/schemas/Entity"

    #@overlay/match missing_ok=True
    GetEntityResponse:
      type: "object"
      properties:
        entity:
          $ref: "#/components/schemas/Entity"

    #@overlay/match missing_ok=True
    GetEntityTypeResponse:
      type: "object"
      properties:
        entityType:
          $ref: "#/components/schemas/EntityType"

    #@overlay/match missing_ok=True
    Entity:
      type: "object"
      properties:
        entityId:
          type: "string"
          description: "Entity identifier"
        entityTypeId:
          type: "string"
          description: "Entity Type identifier"
        name:
          type: "string"
          description: "Entity Name"
        insertedDate:
          type: "string"
          description: "Inserted Timestamp"
        attributes:
          type: "array"
          description: "List of Entity Attributes"
          items:
            $ref: "#/components/schemas/EntityAttribute"

    #@overlay/match missing_ok=True
    AddEntityRequest:
      type: "object"
      properties:
        entity:
          $ref: "#/components/schemas/AddEntity"

    #@overlay/match missing_ok=True
    SetEntityRequest:
      type: "object"
      properties:
        entity:
          $ref: "#/components/schemas/AddEntity"

    #@overlay/match missing_ok=True
    UpdateEntityRequest:
      type: "object"
      properties:
        entity:
          $ref: "#/components/schemas/AddEntity"

    #@overlay/match missing_ok=True
    AddEntity:
      type: "object"
      properties:
        name:
          type: "string"
          description: "Entity Name"
        attributes:
          type: "array"
          description: "List of Entity Attributes"
          items:
            $ref: "#/components/schemas/AddEntityAttribute"

    #@overlay/match missing_ok=True
    AddEntityAttribute:
      type: "object"
      properties:
        key:
          type: "string"
          description: "Attribute key"
        stringValue:
          type: "string"
          description: "Attribute with string value"
        stringValues:
          type: "array"
          description: "Attribute with string values"
          items:
            type: "string"
        numberValue:
          type: "number"
          description: "Attribute with number value"
        numberValues:
          type: "array"
          description: "Attribute with number values"
          items:
            type: "number"
        booleanValue:
          type: "boolean"
          description: "Attribute with boolean value"

    #@overlay/match missing_ok=True
    EntityAttribute:
      type: "object"
      properties:
        key:
          type: "string"
          description: "Attribute key"
        stringValue:
          type: "string"
          description: "Attribute with string value"
        stringValues:
          type: "array"
          description: "Attribute with string values"
          items:
            type: "string"
        numberValue:
          type: "number"
          description: "Attribute with number value"
        numberValues:
          type: "array"
          description: "Attribute with number values"
          items:
            type: "number"
        booleanValue:
          type: "boolean"
          description: "Attribute with boolean value"
        dateValue:
          type: "string"
          description: "Attribute with date value"
        dateValues:
          type: "array"
          description: "Attribute with date values"
          items:
            type: "string"
        valueType:
          $ref: "#/components/schemas/AttributeValueType"

    #@overlay/match missing_ok=True
    GetEntityTypesResponse:
      type: "object"
      properties:
        next:
          type: "string"
          description: "Next page of results token"
        entityTypes:
          type: "array"
          description: "List of Entity Types"
          items:
            $ref: "#/components/schemas/EntityType"

    #@overlay/match missing_ok=True
    EntityType:
      type: "object"
      properties:
        entityTypeId:
          type: "string"
          description: "Entity Type identifier"
        namespace:
          $ref: "#/components/schemas/EntityTypeNamespace"
        name:
          type: "string"
          description: "Entity Type Name"
        insertedDate:
          type: "string"
          description: "Inserted Timestamp"

    #@overlay/match missing_ok=True
    AddEntityTypeRequest:
      type: "object"
      properties:
        entityType:
          $ref: "#/components/schemas/AddEntityType"

    #@overlay/match missing_ok=True
    SetEntityTypeRequest:
      type: "object"
      properties:
        entityType:
          $ref: "#/components/schemas/AddEntityType"

    #@overlay/match missing_ok=True
    AddEntityType:
      type: "object"
      properties:
        namespace:
          $ref: "#/components/schemas/EntityTypeNamespace"
        name:
          type: "string"
          description: "Entity Type Name"

    #@overlay/match missing_ok=True
    EntityTypeNamespace:
      type: string
      description: Entity Type namespace
      enum:
        - PRESET
        - CUSTOM
