        - $ref: '#/components/parameters/entityTypeIdParam'
        - $ref: '#/components/parameters/namespaceParam'
        - $ref: '#/components/parameters/nextParam'
        - $ref: '#/components/parameters/limitParam'
      responses:
        '200':
          description: "200 OK"
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
            Access-Control-Allow-Methods:
              $ref: '#/components/headers/AccessControlAllowMethods'
            Access-Control-Allow-Headers:
              $ref: '#/components/headers/AccessControlAllowHeaders'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GetEntitiesResponse"
      security:
      - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/lambdaApi200"
    post:
      operationId: AddEntity
      description: |-
        Creates an entity.

        Requires WRITE_RETENTION_POLICY for the PRESET RetentionPolicy type,
        WRITE_REMINDER_POLICY for the PRESET ReminderPolicy type, or WRITE_ENTITY
        for other types. The dedicated preset permission replaces the generic entity
        permission; WRITE_ENTITY alone does not authorize either dedicated preset.
        The preset is identified by its stored namespace and name, whether the request
        identifies the entity type by name or UUID. A CUSTOM type with the same name
        continues to use the generic entity permission.
      summary: Add New Entity
      x-formkiq-required-permission: WRITE_ENTITY
      x-formkiq-required-permission-by-preset:
        RetentionPolicy: WRITE_RETENTION_POLICY
        ReminderPolicy: WRITE_REMINDER_POLICY
      tags:
        - Entity
      parameters:
        - $ref: '#/components/parameters/siteIdParam'
        - $ref: '#/components/parameters/entityTypeIdParam'
        - $ref: '#/components/parameters/namespaceParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddEntityRequest'
      responses:
        '201':
          description: 201 CREATED
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
            Access-Control-Allow-Methods:
              $ref: '#/components/headers/AccessControlAllowMethods'
            Access-Control-Allow-Headers:
              $ref: '#/components/headers/AccessControlAllowHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddEntityResponse'
        '400':
          description: 400 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorsResponse'
      security:
      - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/lambdaApi201"

  #@overlay/match missing_ok=True
  /entities/{entityTypeId}/{entityId}:
    get:
      operationId: GetEntity
      x-formkiq-required-permission: READ_ENTITY
      x-formkiq-required-permission-by-preset:
        RetentionPolicy: READ_RETENTION_POLICY
        ReminderPolicy: READ_REMINDER_POLICY
      tags:
        - Entity
      description: |-
        Returns an entity.

        Requires READ_RETENTION_POLICY for the PRESET RetentionPolicy type,
        READ_REMINDER_POLICY for the PRESET ReminderPolicy type, or READ_ENTITY
        for other types. The dedicated preset permission replaces the generic entity
        permission; READ_ENTITY alone does not authorize either dedicated preset.
        The preset is identified by its stored namespace and name, whether the request
        identifies the entity type by name or UUID. A CUSTOM type with the same name
        continues to use the generic entity permission.
      summary: Get Entity
      parameters:
        - $ref: '#/components/parameters/siteIdParam'
        - $ref: '#/components/parameters/entityTypeIdParam'
        - $ref: '#/components/parameters/entityIdParam'
        - $ref: '#/components/parameters/namespaceParam'
      responses:
        '200':
          description: "200 OK"
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
            Access-Control-Allow-Methods:
              $ref: '#/components/headers/AccessControlAllowMethods'
            Access-Control-Allow-Headers:
              $ref: '#/components/headers/AccessControlAllowHeaders'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GetEntityResponse"
      security:
      - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/lambdaApi200"
    put:
      operationId: SetEntity
      description: |-
        Sets an entity.

        Requires WRITE_RETENTION_POLICY for the PRESET RetentionPolicy type,
        WRITE_REMINDER_POLICY for the PRESET ReminderPolicy type, or WRITE_ENTITY
        for other types. The dedicated preset permission replaces the generic entity
        permission; WRITE_ENTITY alone does not authorize either dedicated preset.
        The preset is identified by its stored namespace and name, whether the request
        identifies the entity type by name or UUID. A CUSTOM type with the same name
        continues to use the generic entity permission.
      summary: Set Entity
      x-formkiq-required-permission: WRITE_ENTITY
      x-formkiq-required-permission-by-preset:
        RetentionPolicy: WRITE_RETENTION_POLICY
        ReminderPolicy: WRITE_REMINDER_POLICY
      tags:
        - Entity
      parameters:
        - $ref: '#/components/parameters/siteIdParam'
        - $ref: '#/components/parameters/entityTypeIdParam'
        - $ref: '#/components/parameters/entityIdParam'
        - $ref: '#/components/parameters/namespaceParam'
        - $ref: '#/components/parameters/createIfMissingParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetEntityRequest'
      responses:
        '200':
          description: 200 OK
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
            Access-Control-Allow-Methods:
              $ref: '#/components/headers/AccessControlAllowMethods'
            Access-Control-Allow-Headers:
              $ref: '#/components/headers/AccessControlAllowHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetResponse'
        '400':
          description: 400 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorsResponse'
      security:
      - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/lambdaApi200"
    patch:
      operationId: UpdateEntity
      description: |-
        Updates an entity.

        Requires WRITE_RETENTION_POLICY for the PRESET RetentionPolicy type,
        WRITE_REMINDER_POLICY for the PRESET ReminderPolicy type, or WRITE_ENTITY
        for other types. The dedicated preset permission replaces the generic entity
        permission; WRITE_ENTITY alone does not authorize either dedicated preset.
        The preset is identified by its stored namespace and name, whether the request
        identifies the entity type by name or UUID. A CUSTOM type with the same name
        continues to use the generic entity permission.
      summary: Update Entity
      x-formkiq-required-permission: WRITE_ENTITY
      x-formkiq-required-permission-by-preset:
        RetentionPolicy: WRITE_RETENTION_POLICY
        ReminderPolicy: WRITE_REMINDER_POLICY
      tags:
