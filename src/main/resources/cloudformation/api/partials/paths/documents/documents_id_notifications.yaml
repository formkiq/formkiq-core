#@ load("@ytt:overlay", "overlay")
#@overlay/match by=overlay.all
---
paths:
  #@overlay/match missing_ok=True
  /documents/{documentId}/notifications:
    get:
      operationId: GetDocumentNotifications
      summary: Get document notifications
      description: Get notifications attached to a document or one of its artifacts
      tags:
        - Document Notifications
      parameters:
        - $ref: '#/components/parameters/siteIdParam'
        - $ref: '#/components/parameters/documentIdParam'
        - $ref: '#/components/parameters/artifactIdParam'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/nextParam'
      responses:
        '200':
          description: 200 OK
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
            Access-Control-Allow-Methods:
              $ref: '#/components/headers/AccessControlAllowMethods'
            Access-Control-Allow-Headers:
              $ref: '#/components/headers/AccessControlAllowHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDocumentNotificationsResponse'
      security:
        - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/lambdaApi200"
    post:
      operationId: AddDocumentNotification
      summary: Add an ad hoc document notification
      description: Queue an ad hoc notification for a document or one of its artifacts
      tags:
        - Document Notifications
      parameters:
        - $ref: '#/components/parameters/siteIdParam'
        - $ref: '#/components/parameters/documentIdParam'
        - $ref: '#/components/parameters/artifactIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDocumentNotificationRequest'
      responses:
        '202':
          description: Notification accepted for delivery
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
            Access-Control-Allow-Methods:
              $ref: '#/components/headers/AccessControlAllowMethods'
            Access-Control-Allow-Headers:
              $ref: '#/components/headers/AccessControlAllowHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddDocumentNotificationResponse'
        '400':
          description: Invalid notification request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorsResponse'
      security:
        - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/lambdaApi200"

components:
  schemas:
    #@overlay/match missing_ok=True
    GetDocumentNotificationsResponse:
      type: object
      properties:
        next:
          type: string
          description: Next page of results token
        notifications:
          type: array
          description: List of document notifications
          items:
            $ref: '#/components/schemas/DocumentNotification'

    #@overlay/match missing_ok=True
    AddDocumentNotificationRequest:
      type: object
      description: At least one CC or BCC recipient is required
      required:
        - notificationType
        - subject
        - body
      properties:
        notificationType:
          $ref: '#/components/schemas/DocumentNotificationType'
        cc:
          type: array
          description: CC recipient email addresses
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: email
        bcc:
          type: array
          description: BCC recipient email addresses
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: email
        subject:
          type: string
          minLength: 1
          description: Notification subject
        body:
          type: string
          minLength: 1
          description: Notification body

    #@overlay/match missing_ok=True
    AddDocumentNotificationResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Notification queueing result

    #@overlay/match missing_ok=True
    DocumentNotification:
      type: object
      properties:
        entityTypeId:
          type: string
          description: Reminder Policy entity type identifier
        entityId:
          type: string
          description: Reminder Policy entity identifier
        cc:
          type: array
          description: Normalized CC recipient email addresses
          items:
            type: string
        bcc:
          type: array
          description: Normalized BCC recipient email addresses
          items:
            type: string
        notificationType:
          $ref: '#/components/schemas/DocumentNotificationType'
        notificationDate:
          type: string
          description: Scheduled notification occurrence date
        status:
          $ref: '#/components/schemas/DocumentNotificationStatus'
        action:
          $ref: '#/components/schemas/DocumentAction'
        insertedDate:
          type: string
          description: Inserted timestamp

    #@overlay/match missing_ok=True
    DocumentNotificationType:
      type: string
      description: Type of document notification
      enum:
        - EMAIL
        - IN_APP

    #@overlay/match missing_ok=True
    DocumentNotificationStatus:
      type: string
      description: Status of the document notification
      enum:
        - PENDING
        - ACTION_CREATED
