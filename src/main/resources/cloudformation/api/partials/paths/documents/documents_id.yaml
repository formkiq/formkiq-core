#@ load("@ytt:overlay", "overlay")
#@overlay/match by=overlay.all
---
paths:
  #@overlay/match missing_ok=True
  /documents/{documentId}:
    get:
      operationId: GetDocument
      summary: Get document
      description: Retrieves a document's details, i.e., metadata
      x-formkiq-required-permission: READ_DOCUMENTS
      tags:
        - Documents
      parameters:
        - $ref: '#/components/parameters/siteIdParam'
        - $ref: '#/components/parameters/documentIdParam'
        - $ref: '#/components/parameters/artifactIdParam'
        - $ref: '#/components/parameters/shareKeyParam'
      responses:
        '200':
          description: 200 OK
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
            Access-Control-Allow-Methods:
              $ref: '#/components/headers/AccessControlAllowMethods'
            Access-Control-Allow-Headers:
              $ref: '#/components/headers/AccessControlAllowHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDocumentResponse'
      security:
      - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/lambdaApi200"
    patch:
      operationId: UpdateDocument
      summary: Update document
      description: |-
        Update a document's details, i.e., metadata
        
        If no content is specified, the endpoint will return a S3 Presigned that will allow for the uploading of Large document data. 

        NOTE:
        - provided attributes will overwrite existing matching attribute keys in the document. Attributes not included in the request body will remain unchanged.
      x-formkiq-required-permission: WRITE_DOCUMENTS
      tags:
        - Documents
      parameters:
        - $ref: '#/components/parameters/siteIdParam'
        - $ref: '#/components/parameters/documentIdParam'
        - $ref: '#/components/parameters/artifactIdParam'
        - $ref: '#/components/parameters/shareKeyParam'
        - $ref: '#/components/parameters/accelerateParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDocumentRequest'
            examples:
              Simple_File:
                value:
                  path: test.txt
                  contentType: text/plain
                  isBase64: false
                  content: This is sample data file
                  tags:
                    - key: category
                      value: sample
                    - key: players
                      values: ["111", "222"]
                  metadata:
                    - key: info
                      value: Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.
      responses:
        '200':
          description: 200 OK
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
            Access-Control-Allow-Methods:
              $ref: '#/components/headers/AccessControlAllowMethods'
            Access-Control-Allow-Headers:
              $ref: '#/components/headers/AccessControlAllowHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddDocumentResponse'
        '400':
          description: 400 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorsResponse'
      security:
      - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/lambdaApi200"
    delete:
      operationId: DeleteDocument
      summary: Delete document
      description: |-
        Select the deletion behavior using deleteType (case-insensitive; surrounding whitespace is ignored):

        - SOFT_DELETE temporarily hides the document's metadata, attributes, and associated records
          from normal API requests. Restore the document using PUT /documents/{documentId}/restore,
          or list soft-deleted documents using GET /documents?softDeleted=true.
        - HARD_DELETE deletes the document's metadata and current contents.
        - CONTENT_ONLY removes the current S3 object while retaining document metadata,
          attributes, tags, processing results, and workflow history. Existing S3 versions are retained.
          Returns 404 when the current content does not exist, including repeated content deletion.

        When no deletion option is supplied, the document's metadata and current contents are deleted.

        The deprecated softDelete parameter remains supported for backward compatibility.
        Without deleteType, softDelete=true selects SOFT_DELETE.
        If softDelete is false or omitted, HARD_DELETE is used.

        When deleteType is supplied, it takes precedence and softDelete is ignored.
      x-formkiq-required-permission: DELETE_DOCUMENTS
      tags:
        - Documents
      parameters:
        - $ref: '#/components/parameters/siteIdParam'
        - $ref: '#/components/parameters/documentIdParam'
        - $ref: '#/components/parameters/artifactIdParam'
        - name: "softDelete"
          in: "query"
          deprecated: true
          description: |-
            Legacy deletion flag. Set true to soft delete the document, equivalent to
            deleteType=SOFT_DELETE. Existing requests remain supported.
            Ignored when deleteType is supplied.
          schema:
            type: "boolean"
        - name: "deleteType"
          in: "query"
          description: |-
            Case-insensitive deletion mode; surrounding whitespace is ignored.
            Defaults to HARD_DELETE when no deletion option is supplied.
            Takes precedence over the deprecated softDelete parameter when both are supplied.
          schema:
            $ref: '#/components/schemas/DocumentDeleteType'
      responses:
        '200':
          $ref: '#/components/responses/200CorsDeleteResponse'
        '400':
          description: Invalid deletion mode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorsResponse'
        '404':
          description: |-
            Document or content not found. Content-only deletion returns this status when the current
            S3 object is absent, including repeated deletion, with the message
            "Document content for {documentId} not found."
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
      security:
      - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/lambdaApi200"

components:
  schemas:
    #@overlay/match missing_ok=True
    DocumentDeleteType:
      type: string
      description: |-
        Deletion mode for DELETE /documents/{documentId}.
        SOFT_DELETE temporarily hides the document until restored.
        HARD_DELETE deletes document metadata and current contents.
        CONTENT_ONLY deletes the current S3 object while preserving document metadata and associated
        records. Existing S3 versions are retained; this mode does not purge historical content.
      enum:
        - SOFT_DELETE
        - HARD_DELETE
        - CONTENT_ONLY

    #@overlay/match missing_ok=True
    GetDocumentResponse:
      required:
        - "documentId"
      type: "object"
      properties:
        artifactId:
          type: "string"
          description: "Artifact Identifier"
        promotedArtifactId:
          type: "string"
          description: "Promoted Artifact Identifier"
        artifactCategory:
          type: "string"
          description: "Artifact Category"
        hasArtifacts:
          type: "boolean"
          description: "Whether the document has artifact documents"
        siteId:
          type: "string"
          description: "Site Identifier"
        path:
          type: "string"
          description: "Path or Name of document"
        width:
          type: "string"
          description: "Document Content Width property"
        height:
          type: "string"
          description: "Document Content Height property"
        deepLinkPath:
          type: "string"
          description: "Path or Name of deep link"
        resourceType:
          $ref: "#/components/schemas/DocumentResourceType"
        insertedDate:
          type: "string"
          description: "Inserted Timestamp"
        lastModifiedDate:
          type: "string"
          description: "Last Modified Timestamp"
        checksum:
          type: "string"
          description: "Document checksum, changes when document file changes"
        checksumType:
          $ref: "#/components/schemas/ChecksumType"
        documentId:
          type: "string"
          description: "Document Identifier"
        contentType:
          type: "string"
          description: "Document Content-Type"
        userId:
          type: "string"
          description: "User who added document"
        contentLength:
          type: "integer"
          description: "Document size"
        versionId:
          type: "string"
          description: "Document version"
        documents:
          type: "array"
          description: "List of child documents"
          items:
            $ref: "#/components/schemas/ChildDocument"
        belongsToDocumentId:
          type: "string"
          description: "Parent Document Identifier"
        metadata:
          type: "array"
          description: "List of document Metadata"
          items:
            $ref: "#/components/schemas/DocumentMetadata"

    #@overlay/match missing_ok=True
    ChildDocument:
      required:
        - "documentId"
      type: "object"
      properties:
        path:
          type: "string"
          description: "Path or Name of document"
        width:
          type: "string"
          description: "Document Content Width property"
        height:
          type: "string"
          description: "Document Content Height property"
        deepLinkPath:
          type: "string"
          description: "Path or Name of deep link"
        resourceType:
          $ref: "#/components/schemas/DocumentResourceType"
        insertedDate:
          type: "string"
          description: "Inserted Timestamp"
        lastModifiedDate:
          type: "string"
          description: "Last Modified Timestamp"
        checksum:
          type: "string"
          description: "Document checksum, changes when document file changes"
        documentId:
          type: "string"
          description: "Document Identifier"
        hasArtifacts:
          type: "boolean"
          description: "Whether the document has artifact documents"
        contentType:
          type: "string"
          description: "Document Content-Type"
        userId:
          type: "string"
          description: "User who added document"
        contentLength:
          type: "integer"
          description: "Document size"
        versionId:
          type: "string"
          description: "Document version"
        belongsToDocumentId:
          type: "string"
          description: "Parent Document Identifier"
        attributes:
          type: "array"
          description: "List of document attributes"
          items:
            $ref: "#/components/schemas/DocumentAttribute"

    #@overlay/match missing_ok=True
    UpdateDocumentRequest:
      type: "object"
      properties:
        artifactCategory:
          type: "string"
          description: "Artifact Category"
        path:
          type: "string"
          description: "Path or Name of document"
        width:
          type: "string"
          description: "Document Content Width property"
        height:
          type: "string"
          description: "Document Content Height property"
        deepLinkPath:
          type: "string"
          description: "Path or Name of deep link"
        contentType:
          type: "string"
          description: "Document media type"
        isBase64:
          type: "boolean"
          description: "Is the content Base64-encoded?"
        content:
          type: "string"
          description: "Document content"
        checksum:
          type: "string"
          description: "Document checksum, changes when document file changes"
        checksumType:
          $ref: "#/components/schemas/ChecksumType"
        tags:
          type: "array"
          description: "List of document tags"
          items:
            $ref: "#/components/schemas/AddDocumentTag"
        metadata:
          type: "array"
          description: "List of document Metadata"
          items:
            $ref: "#/components/schemas/AddDocumentMetadata"
        attributes:
          type: "array"
          description: "List of document attributes"
          items:
            $ref: "#/components/schemas/AddDocumentAttribute"
        actions:
          type: array
          description: "List of Actions"
          items:
            $ref: "#/components/schemas/AddAction"
        documents:
          type: "array"
          description: "List of child documents"
          items:
            $ref: "#/components/schemas/AddChildDocument"
