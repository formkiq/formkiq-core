#@ load("@ytt:overlay", "overlay")
#@overlay/match by=overlay.all
---
paths:
  #@overlay/match missing_ok=True
  /documents/{documentId}/attributes:
    get:
      operationId: GetDocumentAttributes
      summary: Get document's attributes
      description: Get a listing of a document's attributes
      tags:
        - Document Attributes
      parameters:
        - $ref: '#/components/parameters/siteIdParam'
        - $ref: '#/components/parameters/documentIdParam'
        - $ref: '#/components/parameters/artifactIdParam'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/nextParam'
      responses:
        '200':
          description: 200 OK
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
            Access-Control-Allow-Methods:
              $ref: '#/components/headers/AccessControlAllowMethods'
            Access-Control-Allow-Headers:
              $ref: '#/components/headers/AccessControlAllowHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDocumentAttributesResponse'
      security:
      - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/lambdaApi200"
    post:
      operationId: AddDocumentAttributes
      summary: Add attribute to document
      description: |-
        Add multiple attributes to a document; this endpoint also accepts a different body parameter for adding a single attribute

        For an attribute defined with dataType JSON, supply one object or array in jsonValue.
        Do not combine jsonValue with scalar, entity, classification, or relationship value fields.
      tags:
        - Document Attributes
      parameters:
        - $ref: '#/components/parameters/siteIdParam'
        - $ref: '#/components/parameters/documentIdParam'
        - $ref: '#/components/parameters/artifactIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDocumentAttributesRequest'
            examples:
              JSON_Attribute:
                value:
                  attributes:
                    - key: invoiceDetails
                      jsonValue:
                        total: 1250.50
                        approved: true
                        customer:
                          name: Acme
                        lineItems:
                          - sku: HOSTING
                            quantity: 2
      responses:
        '201':
          $ref: '#/components/responses/201CorsAddResponse'
      security:
      - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/lambdaApi201"
    put:
      operationId: SetDocumentAttributes
      summary: Set document's attributes
      description: |-
        Set multiple attributes to a document; this endpoint also accepts a different body parameter for setting a single attribute

        Note:
        - attributes in the request will overwrite existing attributes.
        - jsonValue replaces the entire JSON object or array; nested fields are not merged.
      tags:
        - Document Attributes
      parameters:
        - $ref: '#/components/parameters/siteIdParam'
        - $ref: '#/components/parameters/documentIdParam'
        - $ref: '#/components/parameters/artifactIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetDocumentAttributesRequest'
      responses:
        '200':
          $ref: '#/components/responses/200CorsSetResponse'
      security:
      - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/lambdaApi200"

  #@overlay/match missing_ok=True
  /documents/{documentId}/attributes/{attributeKey}:
    get:
      operationId: GetDocumentAttribute
      summary: Get document attribute by key
      description: Get a document attribute by using its key
      tags:
        - Document Attributes
      parameters:
        - $ref: '#/components/parameters/siteIdParam'
        - $ref: '#/components/parameters/documentIdParam'
        - $ref: '#/components/parameters/artifactIdParam'
        - $ref: '#/components/parameters/attributeKeyParam'
      responses:
        '200':
          description: 200 OK
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
            Access-Control-Allow-Methods:
              $ref: '#/components/headers/AccessControlAllowMethods'
            Access-Control-Allow-Headers:
              $ref: '#/components/headers/AccessControlAllowHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDocumentAttributeResponse'
      security:
      - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/lambdaApi200"
    put:
      operationId: SetDocumentAttributeValue
      summary: Set document's attributes value
      description: |-
        Set an attribute value on a document. For an attribute defined with dataType JSON,
        supply jsonValue to replace the entire object or array. Nested fields are not merged.
      tags:
        - Document Attributes
      parameters:
        - $ref: '#/components/parameters/siteIdParam'
        - $ref: '#/components/parameters/documentIdParam'
        - $ref: '#/components/parameters/artifactIdParam'
        - $ref: '#/components/parameters/attributeKeyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetDocumentAttributeRequest'
            examples:
              Replace_JSON_Attribute:
                value:
                  attribute:
                    jsonValue:
                      total: 1250.50
                      approved: true
                      customer:
                        name: Acme
      responses:
        '200':
          $ref: '#/components/responses/200CorsSetResponse'
      security:
      - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/lambdaApi200"
    delete:
      operationId: DeleteDocumentAttribute
      summary: Delete document attribute
      description: |-
        Delete a document attribute by using its key. For a JSON attribute, this deletes the
        entire JSON object or array, subject to authorization and required-attribute validation.
      tags:
        - Document Attributes
      parameters:
        - $ref: '#/components/parameters/siteIdParam'
        - $ref: '#/components/parameters/documentIdParam'
        - $ref: '#/components/parameters/artifactIdParam'
        - $ref: '#/components/parameters/attributeKeyParam'
      responses:
        '200':
          $ref: '#/components/responses/200CorsDeleteResponse'
      security:
      - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/lambdaApi200"

  #@overlay/match missing_ok=True
  /documents/{documentId}/attributes/{attributeKey}/{attributeValue}:
    delete:
      operationId: DeleteDocumentAttributeAndValue
      summary: Delete document's attribute value
      description: |-
        Delete a specific document attribute key/value combination; the request will be ignored
        if there is no valid key/value combination found.

        Attributes defined with dataType JSON are rejected with 400 Bad Request, regardless of
        the supplied attributeValue. No data is changed. Delete the entire JSON attribute using
        DELETE /documents/{documentId}/attributes/{attributeKey} instead.
      tags:
        - Document Attributes
      parameters:
        - $ref: '#/components/parameters/siteIdParam'
        - $ref: '#/components/parameters/documentIdParam'
        - $ref: '#/components/parameters/artifactIdParam'
        - $ref: '#/components/parameters/attributeKeyParam'
        - $ref: '#/components/parameters/attributeValueParam'
      responses:
        '200':
          $ref: '#/components/responses/200CorsDeleteResponse'
        '400':
          description: JSON attributes must be deleted by attribute key, or attribute validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorsResponse'
              example:
                errors:
                  - key: invoiceDetails
                    error: JSON attributes must be deleted by attribute key.
      security:
      - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/lambdaApi200"

  #@overlay/match missing_ok=True
  /documents/{documentId}/attributes/{attributeKey}/generate:
    post:
      operationId: GenerateDocumentAttributeValue
      description: Allocates the next value from the numbering sequence configured for the attribute key and stores it on the document. If the document already has a value for the attribute key, the existing value is returned.
      summary: Generate document attribute value
      tags:
        - Document Attributes
      parameters:
        - $ref: '#/components/parameters/siteIdParam'
        - $ref: '#/components/parameters/documentIdParam'
        - $ref: '#/components/parameters/attributeKeyParam'
      responses:
        '200':
          description: "200 OK"
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
            Access-Control-Allow-Methods:
              $ref: '#/components/headers/AccessControlAllowMethods'
            Access-Control-Allow-Headers:
              $ref: '#/components/headers/AccessControlAllowHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateDocumentAttributeValueResponse'
        '400':
          description: Attribute key is not eligible for generated values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorsResponse'
        '404':
          description: Document or numbering sequence not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorsResponse'
      security:
      - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/lambdaApi200"

components:
  schemas:
    #@overlay/match missing_ok=True
    JsonAttributeValue:
      description: |-
        One JSON object or array stored as a single attribute value. Scalar and null roots are
        not accepted. Nested values may include objects, arrays, strings, numbers, booleans,
        and null. Empty objects and arrays are accepted. Object property order and original
        number formatting are not preserved.

        The complete stored DynamoDB item, including metadata and attribute names, must fit
        within 400 KB. Stored document nesting must not exceed 32 levels, including the wrapper.
        Numbers must fit within DynamoDB's supported range and 38 digits of precision.
      oneOf:
        - type: object
          additionalProperties: true
        - type: array
          items: {}
      example:
        total: 1250.50
        approved: true
        customer:
          name: Acme
        notes: null
        lineItems:
          - sku: HOSTING
            quantity: 2

    #@overlay/match missing_ok=True
    JsonAttributeValueExclusive:
      type: object
      description: A JSON value cannot be combined with other attribute value forms.
      not:
        allOf:
          - required: [jsonValue]
          - anyOf:
              - required: [stringValue]
              - required: [stringValues]
              - required: [numberValue]
              - required: [numberValues]
              - required: [booleanValue]
              - required: [dateValue]
              - required: [dateValues]
              - required: [entityTypeId]
              - required: [entityId]
              - required: [entity]
              - required: [entities]
              - required: [classificationId]
              - required: [relationship]
              - required: [inverseRelationship]

    #@overlay/match missing_ok=True
    AddDocumentAttributeValue:
      type: "object"
      description: |-
        Document attribute value. JSON attributes require jsonValue and cannot use other value
        forms. A missing jsonValue is invalid for an attribute defined with dataType JSON.
      allOf:
        - $ref: '#/components/schemas/JsonAttributeValueExclusive'
      properties:
        jsonValue:
          $ref: '#/components/schemas/JsonAttributeValue'
        stringValue:
          type: "string"
          description: "Attribute with string value"
        stringValues:
          type: "array"
          description: "Attribute with string values"
          items:
            type: "string"
        numberValue:
          type: "number"
          description: "Attribute with number value"
        numberValues:
          type: "array"
          description: "Attribute with number values"
          items:
            type: "number"
        booleanValue:
          type: "boolean"
          description: "Attribute with boolean value"
        dateValue:
          type: "string"
          description: "Attribute with date value"
        dateValues:
          type: "array"
          description: "Attribute with date values"
          items:
            type: "string"


    #@overlay/match missing_ok=True
    SetDocumentAttributeRequest:
      type: "object"
      description: "Set List of document attributes"
      properties:
        attribute:
          $ref: "#/components/schemas/AddDocumentAttributeValue"

    #@overlay/match missing_ok=True
    SetDocumentAttributesRequest:
      type: "object"
      description: "Set List of document attributes"
      properties:
        attributes:
          type: "array"
          description: "List of document attributes"
          items:
            $ref: "#/components/schemas/AddDocumentAttribute"


    #@overlay/match missing_ok=True
    GetDocumentAttributesResponse:
      type: "object"
      properties:
        next:
          type: "string"
          description: "Next page of results token"
        attributes:
          type: "array"
          description: "List of attributes"
          items:
            $ref: "#/components/schemas/DocumentAttribute"

    #@overlay/match missing_ok=True
    GetDocumentAttributeResponse:
      type: "object"
      properties:
        attribute:
          $ref: "#/components/schemas/DocumentAttribute"

    #@overlay/match missing_ok=True
    GenerateDocumentAttributeValueResponse:
      type: "object"
      required:
        - attribute
        - sequence
        - period
      properties:
        attribute:
          $ref: "#/components/schemas/DocumentAttribute"
        sequence:
          type: "integer"
          format: "int64"
          description: "Allocated sequence number"
          example: 1
        period:
          type: "string"
          description: "Sequence period used for the allocation"
          example: "2026"

    #@overlay/match missing_ok=True
    DocumentAttribute:
      type: "object"
      properties:
        key:
          type: "string"
          description: "Attribute key"
        jsonValue:
          $ref: '#/components/schemas/JsonAttributeValue'
        stringValue:
          type: "string"
          description: "Attribute with string value"
        stringValues:
          type: "array"
          description: "Attribute with string values"
          items:
            type: "string"
        numberValue:
          type: "number"
          description: "Attribute with number value"
        numberValues:
          type: "array"
          description: "Attribute with number values"
          items:
            type: "number"
        booleanValue:
          type: "boolean"
          description: "Attribute with boolean value"
        dateValue:
          type: "string"
          description: "Attribute with date value"
        dateValues:
          type: "array"
          description: "Attribute with date values"
          items:
            type: "string"
        insertedDate:
          type: "string"
          description: "Inserted Timestamp"
        userId:
          type: "string"
          description: "User who added attribute"
        valueType:
          $ref: "#/components/schemas/AttributeValueType"
        entity:
          $ref: '#/components/schemas/Entity'
        entities:
          type: "array"
          description: "Attribute with entity values"
          items:
            $ref: '#/components/schemas/Entity'

    #@overlay/match missing_ok=True
    AttributeValueType:
      type: string
      description: Attribute Value Type
      enum:
        - BOOLEAN
        - DATE
        - KEY_ONLY
        - NUMBER
        - STRING
        - JSON
        - PUBLICATION
        - CLASSIFICATION
        - COMPOSITE_STRING
        - RELATIONSHIPS
        - WATERMARK
        - ENTITY

    #@overlay/match missing_ok=True
    AddDocumentAttributesRequest:
      type: "object"
      description: "Add List of document attributes"
      properties:
        attributes:
          type: "array"
          description: "List of document attributes"
          items:
            $ref: "#/components/schemas/AddDocumentAttribute"

    #@overlay/match missing_ok=True
    AddDocumentAttribute:
      allOf:
        - $ref: '#/components/schemas/JsonAttributeValueExclusive'
      oneOf:
        - $ref: '#/components/schemas/AddDocumentAttributeStandard'
        - $ref: '#/components/schemas/AddDocumentAttributeClassification'
        - $ref: '#/components/schemas/AddDocumentAttributeRelationship'
        - $ref: '#/components/schemas/AddDocumentAttributeEntity'
        - $ref: '#/components/schemas/AddDocumentAttributeEntities'

    #@overlay/match missing_ok=True
    AddDocumentAttributeStandard:
      required:
        - "key"
      type: "object"
      description: |-
        Document attribute. An attribute defined with dataType JSON requires jsonValue and
        cannot use other value forms. One object or array is stored per attribute key.
      allOf:
        - $ref: '#/components/schemas/JsonAttributeValueExclusive'
      properties:
        key:
          type: "string"
          description: "Attribute key"
        jsonValue:
          $ref: '#/components/schemas/JsonAttributeValue'
        stringValue:
          type: "string"
          description: "Attribute with string value"
        stringValues:
          type: "array"
          description: "Attribute with string values"
          items:
            type: "string"
        numberValue:
          type: "number"
          description: "Attribute with number value"
        numberValues:
          type: "array"
          description: "Attribute with number values"
          items:
            type: "number"
        booleanValue:
          type: "boolean"
          description: "Attribute with boolean value"
        dateValue:
          type: "string"
          description: "Attribute with date value"
        dateValues:
          type: "array"
          description: "Attribute with date values"
          items:
            type: "string"

    #@overlay/match missing_ok=True
    AddDocumentAttributeClassification:
      required:
        - "classificationId"
      type: "object"
      description: "Document Classification"
      properties:
        classificationId:
          type: "string"
          description: "Classification Identifier"

    #@overlay/match missing_ok=True
    AddDocumentAttributeRelationship:
      required:
        - "documentId"
        - "relationship"
      type: "object"
      description: "Document Relationship"
      properties:
        documentId:
          type: "string"
          description: "Relationship To Document Identifier"
        relationship:
          $ref: "#/components/schemas/DocumentRelationshipType"
        inverseRelationship:
          $ref: "#/components/schemas/DocumentRelationshipType"

    #@overlay/match missing_ok=True
    AddDocumentAttributeEntity:
      required:
        - "key"
        - "entityTypeId"
        - "entityId"
      type: "object"
      description: "Document Entity Attribute"
      properties:
        key:
          type: "string"
          description: "Attribute key"
        entityTypeId:
          type: "string"
          description: "EntityType Identifier or Entity Type Name"
        entityId:
          type: "string"
          description: "Entity Identifier"
        namespace:
          $ref: "#/components/schemas/EntityTypeNamespace"

    #@overlay/match missing_ok=True
    AddDocumentAttributeEntities:
      required:
        - "key"
        - "entities"
      type: "object"
      description: "Document Entity Attribute with multiple values"
      properties:
        key:
          type: "string"
          description: "Attribute key"
        entities:
          type: "array"
          description: "Attribute with entity values"
          items:
            $ref: '#/components/schemas/AddDocumentAttributeEntityValue'

    #@overlay/match missing_ok=True
    AddDocumentAttributeEntityValue:
      required:
        - "entityTypeId"
        - "entityId"
      type: "object"
      description: "Document Entity Attribute Value"
      properties:
        entityTypeId:
          type: "string"
          description: "EntityType Identifier or Entity Type Name"
        entityId:
          type: "string"
          description: "Entity Identifier"
        namespace:
          $ref: "#/components/schemas/EntityTypeNamespace"

    #@overlay/match missing_ok=True
    DocumentRelationshipType:
      type: string
      description: Document Relationship Type
      enum:
        - PRIMARY
        - ATTACHMENT
        - APPENDIX
        - SUPPLEMENT
        - ASSOCIATED
        - RENDITION
