#@ load("@ytt:overlay", "overlay")
#@overlay/match by=overlay.all
---
paths:
  #@overlay/match missing_ok=True
  /documents/{documentId}/reviews:
    get:
      operationId: GetDocumentReviews
      summary: Get document reviews
      description: Get a listing of reviews for a document, including the effective countedDecisionTypes policy for each review.
      tags:
        - Document Reviews
      parameters:
        - $ref: '#/components/parameters/siteIdParam'
        - $ref: '#/components/parameters/documentIdParam'
        - $ref: '#/components/parameters/artifactIdParam'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/nextParam'
      responses:
        '200':
          description: 200 OK
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
            Access-Control-Allow-Methods:
              $ref: '#/components/headers/AccessControlAllowMethods'
            Access-Control-Allow-Headers:
              $ref: '#/components/headers/AccessControlAllowHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDocumentReviewsResponse'
      security:
      - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/lambdaApi200"
    post:
      operationId: AddDocumentReview
      summary: Add document review
      description: |-
        Add a review to a document. When notifications are supplied, queue each notification
        for delivery when the review is created.
        Omitted or null countedDecisionTypes defaults to [APPROVAL]. Only decision records of the
        configured types count toward requiredDecisions; other supported types may still be submitted.
        The same counting policy applies to document-level and artifact-scoped reviews.
      tags:
        - Document Reviews
      parameters:
        - $ref: '#/components/parameters/siteIdParam'
        - $ref: '#/components/parameters/documentIdParam'
        - $ref: '#/components/parameters/artifactIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDocumentReviewRequest'
            examples:
              approvalReview:
                summary: Require two approval-type responses
                value:
                  review:
                    reviewCategory: Legal
                    requiredDecisions: 2
                    countedDecisionTypes: [APPROVAL]
              acknowledgmentReview:
                summary: Require one acknowledgment while allowing other decision types
                value:
                  review:
                    reviewCategory: Receipt
                    requiredDecisions: 1
                    countedDecisionTypes: [ACKNOWLEDGMENT]
      responses:
        '201':
          description: 201 CREATED
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
            Access-Control-Allow-Methods:
              $ref: '#/components/headers/AccessControlAllowMethods'
            Access-Control-Allow-Headers:
              $ref: '#/components/headers/AccessControlAllowHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddDocumentReviewResponse'
        '400':
          description: Invalid review configuration, including empty, duplicate, unknown, or non-string countedDecisionTypes entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorsResponse'
      security:
      - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/lambdaApi201"

  #@overlay/match missing_ok=True
  /documents/{documentId}/reviews/{reviewId}:
    get:
      operationId: GetDocumentReview
      summary: Get document review
      description: Get a document review by review id, including its effective countedDecisionTypes policy. Reviews stored without an explicit policy return [APPROVAL]; historical completed reviews retain their status.
      tags:
        - Document Reviews
      parameters:
        - $ref: '#/components/parameters/siteIdParam'
        - $ref: '#/components/parameters/documentIdParam'
        - $ref: '#/components/parameters/artifactIdParam'
        - $ref: '#/components/parameters/reviewIdParam'
      responses:
        '200':
          description: 200 OK
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
            Access-Control-Allow-Methods:
              $ref: '#/components/headers/AccessControlAllowMethods'
            Access-Control-Allow-Headers:
              $ref: '#/components/headers/AccessControlAllowHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDocumentReviewResponse'
      security:
      - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/lambdaApi200"
    patch:
      operationId: UpdateDocumentReview
      summary: Update document review
      description: |-
        Update a document review by review id. Omitted properties retain their existing values.
        Changes to countedDecisionTypes or requiredDecisions apply when subsequent counted
        decisions are submitted. Updating the counting configuration does not change reviewStatus.
      tags:
        - Document Reviews
      parameters:
        - $ref: '#/components/parameters/siteIdParam'
        - $ref: '#/components/parameters/documentIdParam'
        - $ref: '#/components/parameters/artifactIdParam'
        - $ref: '#/components/parameters/reviewIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDocumentReviewRequest'
      responses:
        '200':
          $ref: '#/components/responses/200CorsUpdateResponse'
        '400':
          description: Invalid review configuration, including empty, duplicate, unknown, or non-string countedDecisionTypes entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorsResponse'
      security:
      - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/lambdaApi200"

  #@overlay/match missing_ok=True
  /documents/{documentId}/reviews/{reviewId}/decisions:
    get:
      operationId: GetDocumentReviewDecisions
      summary: Get document review decisions
      description: Get a listing of all decisions for a document review, including records whose types do not count toward completion.
      tags:
        - Document Reviews
      parameters:
        - $ref: '#/components/parameters/siteIdParam'
        - $ref: '#/components/parameters/documentIdParam'
        - $ref: '#/components/parameters/artifactIdParam'
        - $ref: '#/components/parameters/reviewIdParam'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/nextParam'
      responses:
        '200':
          description: 200 OK
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
            Access-Control-Allow-Methods:
              $ref: '#/components/headers/AccessControlAllowMethods'
            Access-Control-Allow-Headers:
              $ref: '#/components/headers/AccessControlAllowHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDocumentReviewDecisionsResponse'
      security:
      - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/lambdaApi200"
    post:
      operationId: AddDocumentReviewDecision
      summary: Add document review decision
      description: |-
        Add a decision to a document review. When approvalGroups is set on the review,
        the caller must belong to at least one of those groups, in addition to satisfying the existing authorization requirements, before the decision is added.
        Every accepted submission is retained with its own decision ID, author, timestamp,
        and content. countedDecisionTypes selects records that contribute to requiredDecisions;
        it does not restrict which supported types may be submitted. Counting uses decision
        records, not distinct reviewers. APPROVAL records count regardless of their decision value.
        With the default [APPROVAL] policy, COMMENT, RECOMMENDATION, and ACKNOWLEDGMENT
        may be submitted repeatedly by the same authorized user while the review is open.
        A non-counting submission may move PENDING to IN_PROGRESS, but cannot complete the
        review or trigger completion-dependent processing. It does not automatically create
        a follow-up review or downstream action; an explicitly supplied follow-up review
        uses the same counting-policy defaults and validation as ordinary review creation.
        Completion occurs when the qualifying count reaches or exceeds requiredDecisions.
        Decisions submitted to a review that is already COMPLETED return 409 Conflict without creating a decision, follow-up review, notification, or activity record.
      tags:
        - Document Reviews
      parameters:
        - $ref: '#/components/parameters/siteIdParam'
        - $ref: '#/components/parameters/documentIdParam'
        - $ref: '#/components/parameters/artifactIdParam'
        - $ref: '#/components/parameters/reviewIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDocumentReviewDecisionRequest'
      responses:
        '201':
          description: 201 CREATED
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
            Access-Control-Allow-Methods:
              $ref: '#/components/headers/AccessControlAllowMethods'
            Access-Control-Allow-Headers:
              $ref: '#/components/headers/AccessControlAllowHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddDocumentReviewDecisionResponse'
        '400':
          description: Invalid decision or explicitly requested follow-up review configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorsResponse'
        '409':
          description: The review is already complete. No decision was created.
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
            Access-Control-Allow-Methods:
              $ref: '#/components/headers/AccessControlAllowMethods'
            Access-Control-Allow-Headers:
              $ref: '#/components/headers/AccessControlAllowHeaders'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: Review is already complete
      security:
      - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/lambdaApi201"

components:
  parameters:
    #@overlay/match missing_ok=True
    reviewIdParam:
      name: reviewId
      in: path
      description: Review Identifier
      required: true
      schema:
        type: string

  schemas:
    #@overlay/match missing_ok=True
    DocumentReviewStatus:
      type: string
      description: |-
        Status of Document Review:
        - PENDING: Review has been created and is waiting for one or more decisions.
        - IN_PROGRESS: Review has been claimed or at least one decision has been submitted, but completion requirements are not yet satisfied.
        - COMPLETED: The required number of records matching countedDecisionTypes has been collected. This status does not imply that every decision approved the document.
        - CANCELLED: Review was cancelled before completion.
        - SUPERSEDED: Review was replaced by another review, usually because the artifact/document changed.
      enum:
        - PENDING
        - IN_PROGRESS
        - COMPLETED
        - CANCELLED
        - SUPERSEDED

    #@overlay/match missing_ok=True
    ReviewDecisionType:
      type: string
      description: Decision type. APPROVAL identifies an approval-type response; the separate decision value represents its outcome and may be positive or negative.
      enum:
        - APPROVAL
        - RECOMMENDATION
        - ACKNOWLEDGMENT
        - COMMENT

    #@overlay/match missing_ok=True
    AddDocumentReviewRequest:
      type: object
      properties:
        review:
          $ref: "#/components/schemas/AddDocumentReview"

    #@overlay/match missing_ok=True
    AddDocumentReviewResponse:
      type: object
      required:
        - reviewId
      properties:
        reviewId:
          type: string
          description: Review Identifier

    #@overlay/match missing_ok=True
    AddDocumentReview:
      type: object
      required:
        - reviewCategory
        - requiredDecisions
      properties:
        reviewCategory:
          type: string
          description: Review category
        reviewStatus:
          $ref: "#/components/schemas/DocumentReviewStatus"
        approvalGroups:
          type: array
          description: Optional approval groups used for additional credential verification when submitting a decision to POST /documents/{documentId}/reviews/{reviewId}/decisions. The caller must belong to at least one of the listed groups, in addition to satisfying the existing authorization requirements.
          items:
            type: string
        requiredDecisions:
          type: integer
          format: int64
          minimum: 0
          description: Number of decision records matching countedDecisionTypes required to complete the review. Records count regardless of decision value or whether the same reviewer submitted earlier records.
        countedDecisionTypes:
          type: array
          nullable: true
          minItems: 1
          uniqueItems: true
          default: [APPROVAL]
          description: |-
            Types of decision records that count toward requiredDecisions. Omission or null defaults
            to [APPROVAL]. This selects records to count and does not restrict which supported
            decision types may be submitted. Empty arrays, duplicate entries, unknown
            types, and non-string entries are rejected.
          items:
            $ref: "#/components/schemas/ReviewDecisionType"
        notifications:
          type: array
          description: Optional notifications to queue for delivery when the review is created. An empty list sends no notifications.
          items:
            $ref: "#/components/schemas/AddDocumentNotificationRequest"
        comments:
          type: string
          description: Review comments

    #@overlay/match missing_ok=True
    UpdateDocumentReviewRequest:
      type: object
      properties:
        review:
          $ref: "#/components/schemas/UpdateDocumentReview"

    #@overlay/match missing_ok=True
    UpdateDocumentReview:
      type: object
      properties:
        reviewStatus:
          $ref: "#/components/schemas/DocumentReviewStatus"
        requiredDecisions:
          type: integer
          format: int64
          minimum: 0
          description: Number of decision records matching countedDecisionTypes required to complete the review. Changes apply when subsequent counted decisions are submitted.
        countedDecisionTypes:
          type: array
          nullable: true
          minItems: 1
          uniqueItems: true
          description: |-
            Replacement types of decision records that count toward requiredDecisions.
            Omission or null preserves the effective current policy; it does not reset it to [APPROVAL].
            Changes apply when subsequent counted decisions are submitted, counting existing
            records against the updated policy. This does not restrict submissions.
            Empty arrays, duplicate entries, unknown types, and non-string entries are rejected.
          items:
            $ref: "#/components/schemas/ReviewDecisionType"
        comments:
          type: string
          description: Review comments

    #@overlay/match missing_ok=True
    GetDocumentReviewsResponse:
      type: object
      properties:
        next:
          type: string
          description: Next page of results token
        reviews:
          type: array
          description: List of document reviews
          items:
            $ref: "#/components/schemas/DocumentReview"

    #@overlay/match missing_ok=True
    GetDocumentReviewResponse:
      type: object
      properties:
        review:
          $ref: "#/components/schemas/DocumentReview"

    #@overlay/match missing_ok=True
    DocumentReview:
      type: object
      required:
        - countedDecisionTypes
      properties:
        documentId:
          type: string
          description: Document Identifier
        artifactId:
          type: string
          description: Artifact Identifier
        reviewId:
          type: string
          description: Review Identifier
        reviewCategory:
          type: string
          description: Review category
        reviewStatus:
          $ref: "#/components/schemas/DocumentReviewStatus"
        approvalGroups:
          type: array
          description: Optional approval groups used for additional credential verification when submitting a decision to POST /documents/{documentId}/reviews/{reviewId}/decisions. The caller must belong to at least one of the listed groups, in addition to satisfying the existing authorization requirements.
          items:
            type: string
        requiredDecisions:
          type: integer
          format: int64
          description: Number of decision records matching countedDecisionTypes required to complete the review. Completion does not imply a positive approval outcome.
        countedDecisionTypes:
          type: array
          nullable: false
          minItems: 1
          uniqueItems: true
          description: Effective types of decision records that count toward requiredDecisions. Always returned by review GET and list operations, including [APPROVAL] for records stored without an explicit policy. This does not restrict which supported decision types may be submitted.
          items:
            $ref: "#/components/schemas/ReviewDecisionType"
        userId:
          type: string
          description: User who added review
        comments:
          type: string
          description: Review comments
        insertedDate:
          type: string
          description: Inserted Timestamp
        lastModifiedDate:
          type: string
          description: Last Modified Timestamp

    #@overlay/match missing_ok=True
    AddDocumentReviewDecisionRequest:
      type: object
      required:
        - decision
      properties:
        decision:
          $ref: "#/components/schemas/AddDocumentReviewDecision"
        review:
          $ref: "#/components/schemas/AddDocumentReview"

    #@overlay/match missing_ok=True
    AddDocumentReviewDecisionResponse:
      type: object
      required:
        - decisionId
      properties:
        decisionId:
          type: string
          description: Decision Identifier

    #@overlay/match missing_ok=True
    AddDocumentReviewDecision:
      type: object
      required:
        - type
      properties:
        type:
          $ref: "#/components/schemas/ReviewDecisionType"
        decision:
          type: string
          description: Review decision
        comment:
          type: string
          description: Review decision comment

    #@overlay/match missing_ok=True
    GetDocumentReviewDecisionsResponse:
      type: object
      properties:
        next:
          type: string
          description: Next page of results token
        decisions:
          type: array
          description: List of document review decisions
          items:
            $ref: "#/components/schemas/DocumentReviewDecision"

    #@overlay/match missing_ok=True
    DocumentReviewDecision:
      type: object
      properties:
        documentId:
          type: string
          description: Document Identifier
        artifactId:
          type: string
          description: Artifact Identifier
        reviewId:
          type: string
          description: Review Identifier
        decisionId:
          type: string
          description: Decision Identifier
        type:
          $ref: "#/components/schemas/ReviewDecisionType"
        decision:
          type: string
          description: Review decision
        comment:
          type: string
          description: Review decision comment
        userId:
          type: string
          description: User who added decision
        insertedDate:
          type: string
          description: Inserted Timestamp
