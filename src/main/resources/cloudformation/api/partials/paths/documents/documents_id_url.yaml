#@ load("@ytt:overlay", "overlay")
#@overlay/match by=overlay.all
---
paths:
  #@overlay/match missing_ok=True
  /documents/{documentId}/url:
    get:
      operationId: GetDocumentUrl
      summary: Get document content url
      description: |-
        Returns a URL for the document's contents. Direct S3 presigned URLs expire after 48 hours by default.

        With the Shortlinks Add-On Module, use `format=short&maxUses=1` for a single-redemption short link,
        or set `maxUses` to a larger positive integer to allow that many redemptions. Omitting `maxUses`
        permits unlimited redemptions during the short link's validity period.

        For usage-limited short links, `duration` controls the short link's validity in hours.
        Each successful redemption generates a fresh S3 presigned URL valid for 20 seconds.
        The S3 request must start before expiry; a download already in progress can continue afterward.
        The S3 URL itself can be reused during those 20 seconds.
      tags:
        - Documents
      parameters:
        - $ref: '#/components/parameters/siteIdParam'
        - $ref: '#/components/parameters/documentIdParam'
        - $ref: '#/components/parameters/artifactIdParam'
        - $ref: '#/components/parameters/versionKeyParam'
        - $ref: '#/components/parameters/durationParam'
        - $ref: '#/components/parameters/shareKeyParam'
        - name: "inline"
          in: "query"
          description: "Request inline delivery. S3-backed SVG documents identified by content type or filename are always served as attachments."
          schema:
            type: boolean
            default: false
        - name: "bypassWatermark"
          in: "query"
          description: "Allow the by pass of watermark (only allowed by GOVERN / ADMIN permissions)"
          schema:
            type: boolean
            default: false
        - name: "format"
          in: "query"
          description: "Return a shortlink URL when set to `short`; available as an Add-On Module"
          schema:
            type: string
            enum:
              - short
        - name: "maxUses"
          in: "query"
          required: false
          description: "Maximum number of successful short-link redemptions. Requires `format=short` and the Shortlinks Add-On Module. Set to `1` for a single redemption; omit for unlimited redemptions during the short link's validity period."
          schema:
            type: integer
            minimum: 1
          example: 1
        - $ref: '#/components/parameters/accelerateParam'
      responses:
        '200':
          description: 200 OK
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
            Access-Control-Allow-Methods:
              $ref: '#/components/headers/AccessControlAllowMethods'
            Access-Control-Allow-Headers:
              $ref: '#/components/headers/AccessControlAllowHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDocumentUrlResponse'
      security:
      - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/lambdaApi200"

components:
  schemas:
    #@overlay/match missing_ok=True
    GetDocumentUrlResponse:
      type: "object"
      properties:
        documentId:
          type: "string"
          description: "Document Identifier"
        artifactId:
          type: "string"
          description: "Artifact Identifier"
        url:
          type: "string"
          description: "Document content url"
        headers:
          type: "object"
          additionalProperties:
            type: object
