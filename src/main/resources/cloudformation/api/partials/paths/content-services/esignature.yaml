#@ load("@ytt:overlay", "overlay")
#@overlay/match by=overlay.all
---
paths:
  #@overlay/match missing_ok=True
  /esignature/docusign/{documentId}/envelopes:
    post:
      operationId: AddDocusignEnvelopes
      summary: Create Docusign Envelope request
      description: >-
        Create a DocuSign envelope for the selected document or artifact; available
        as an Add-On Module. Recipient tabs support signatures, initials, automatic
        signing dates, recipient-entered dates, and single-line or multiline text.
        See DocusignSigningTabs for the supported collections and validation rules.
      tags:
        - E-Signature
      parameters:
        - $ref: '#/components/parameters/siteIdParam'
        - $ref: '#/components/parameters/documentIdParam'
        - $ref: '#/components/parameters/artifactIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDocusignEnvelopesRequest'
            examples:
              signatureDateAndText:
                summary: "Signature, automatic signing date, and multiline text"
                value:
                  emailSubject: "Please review and sign"
                  environment: "DEVELOPMENT"
                  status: "sent"
                  signers:
                    - name: "Jane Smith"
                      email: "signer1@example.com"
                      recipientId: "1"
                      routingOrder: "1"
                      tabs:
                        signHereTabs:
                          - anchorString: "signature1"
                        dateSignedTabs:
                          - anchorString: "date1"
                            tabLabel: "signedOn"
                            anchorIgnoreIfNotPresent: "false"
                        textTabs:
                          - anchorString: "text1"
                            tabLabel: "comments"
                            anchorIgnoreIfNotPresent: "false"
                            width: "300"
                            height: "80"
                            maxLength: "1000"
                            required: "true"
              coordinatePlacement:
                summary: "Signature and editable date placed on the first page"
                value:
                  emailSubject: "Please review and sign"
                  environment: "DEVELOPMENT"
                  status: "sent"
                  signers:
                    - name: "Jane Smith"
                      email: "signer1@example.com"
                      recipientId: "1"
                      routingOrder: "1"
                      tabs:
                        signHereTabs:
                          - pageNumber: "1"
                            xPosition: "100"
                            yPosition: "400"
                        dateTabs:
                          - pageNumber: "1"
                            xPosition: "300"
                            yPosition: "400"
                            tabLabel: "effectiveDate"
                            required: "true"
                            width: "100"
              multipleRecipients:
                summary: "Distinct signature and date anchors for two sequential recipients"
                value:
                  emailSubject: "Please review and sign"
                  environment: "DEVELOPMENT"
                  status: "sent"
                  signers:
                    - name: "Jane Smith"
                      email: "signer1@example.com"
                      recipientId: "1"
                      routingOrder: "1"
                      tabs:
                        signHereTabs:
                          - anchorString: "signature1"
                        dateSignedTabs:
                          - anchorString: "date1"
                            anchorIgnoreIfNotPresent: "false"
                    - name: "John Smith"
                      email: "signer2@example.com"
                      recipientId: "2"
                      routingOrder: "2"
                      tabs:
                        signHereTabs:
                          - anchorString: "signature2"
                        dateSignedTabs:
                          - anchorString: "date2"
                            anchorIgnoreIfNotPresent: "false"
              inpersonSigning:
                summary: "Hosted signing with signature, initials, and an automatic date"
                value:
                  emailSubject: "Please review and sign"
                  environment: "DEVELOPMENT"
                  status: "sent"
                  inpersonSigners:
                    - hostName: "Alex Host"
                      hostEmail: "host@example.com"
                      signerName: "Jane Smith"
                      recipientId: "1"
                      routingOrder: "1"
                      tabs:
                        signHereTabs:
                          - anchorString: "signature1"
                        initialHereTabs:
                          - anchorString: "initial1"
                            optional: "false"
                        dateSignedTabs:
                          - anchorString: "date1"
      responses:
        '200':
          description: 200 OK
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
            Access-Control-Allow-Methods:
              $ref: '#/components/headers/AccessControlAllowMethods'
            Access-Control-Allow-Headers:
              $ref: '#/components/headers/AccessControlAllowHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddDocusignEnvelopesResponse'
        '400':
          description: Invalid envelope request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorsResponse'
              examples:
                invalidTabProperty:
                  summary: "Invalid text field width"
                  value:
                    errors:
                      - key: "signers[0].tabs.textTabs[0].width"
                        error: "Property must be a positive integer"
                invalidTabPlacement:
                  summary: "Missing text field placement"
                  value:
                    errors:
                      - key: "signers[0].tabs.textTabs[0]"
                        error: "Specify either anchorString with anchor options or pageNumber, xPosition and yPosition"
      security:
      - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/esignatureLambdaApi200"

  #@overlay/match missing_ok=True
  /esignature/docusign/{documentId}/envelopes/{envelopeId}/views/recipient:
    post:
      operationId: AddDocusignRecipientView
      summary: Create Docusign Recipient View request
      description: DocuSign create Docusign Recipient View request; available as an Add-On Module
      tags:
        - E-Signature
      parameters:
        - $ref: '#/components/parameters/siteIdParam'
        - $ref: '#/components/parameters/documentIdParam'
        - $ref: '#/components/parameters/artifactIdParam'
        - $ref: '#/components/parameters/docusignEnvelopeIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDocusignRecipientViewRequest'
      responses:
        '200':
          description: 200 OK
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
            Access-Control-Allow-Methods:
              $ref: '#/components/headers/AccessControlAllowMethods'
            Access-Control-Allow-Headers:
              $ref: '#/components/headers/AccessControlAllowHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddDocusignRecipientViewResponse'
        '400':
          description: 400 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorsResponse'
      security:
      - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/esignatureLambdaApi200"

  #@overlay/match missing_ok=True
  /esignature/docusign/{documentId}/envelopes/{envelopeId}/views/sender:
    post:
      operationId: AddDocusignSenderView
      summary: Create Docusign Sender View request
      description: DocuSign create Docusign Sender View request; available as an Add-On Module
      tags:
        - E-Signature
      parameters:
        - $ref: '#/components/parameters/siteIdParam'
        - $ref: '#/components/parameters/documentIdParam'
        - $ref: '#/components/parameters/artifactIdParam'
        - $ref: '#/components/parameters/docusignEnvelopeIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDocusignSenderViewRequest'
            example:
              returnUrl: https://console.example.com/agreements/123/esignature
      responses:
        '200':
          description: 200 OK
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
            Access-Control-Allow-Methods:
              $ref: '#/components/headers/AccessControlAllowMethods'
            Access-Control-Allow-Headers:
              $ref: '#/components/headers/AccessControlAllowHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddDocusignSenderViewResponse'
              example:
                viewUrl: https://...
        '400':
          description: 400 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorsResponse'
      security:
      - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/esignatureLambdaApi200"

  #@overlay/match missing_ok=True
  /esignature/docusign/events:
    post:
      operationId: AddEsignatureDocusignEvents
      summary: Add E-signature event
      description: DocuSign callback URL handler; available as an Add-On Module
      tags:
        - E-Signature
      responses:
        '200':
          description: 200 OK
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
            Access-Control-Allow-Methods:
              $ref: '#/components/headers/AccessControlAllowMethods'
            Access-Control-Allow-Headers:
              $ref: '#/components/headers/AccessControlAllowHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddResponse'
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/esignatureLambdaApi200"

components:
  schemas:
    #@overlay/match missing_ok=True
    DocusignEnvironment:
      type: string
      description: "Docusign environment. When omitted from an E-Signature request, defaults to docusignEnvironment in the site configuration."
      enum:
        - PRODUCTION
        - DEVELOPMENT

    #@overlay/match missing_ok=True
    DocusignEnvelopeStatus:
      type: "string"
      description: |-
        Controls how the envelope is created:
        * `created` saves the envelope as a draft without notifying recipients.
        * `sent` immediately sends the envelope to recipients.
      enum:
        - created
        - sent
      default: sent

    #@overlay/match missing_ok=True
    DocusignRecipientView:
      type: "object"
      properties:
        returnUrl:
          type: "string"
          description: "Identifies the return point after sending the envelope"
        recipientId:
          type: "string"
          description: "A reference used to map recipients to other objects, such as specific document tabs."
        userName:
          type: "string"
          description: "The username of the recipient. You can use either email and userName."
        clientUserId:
          type: "string"
          description: "Specifies unique identifier for signer"
        email:
          type: "string"
          description: "Specifies the email of the recipient"
        frameAncestors:
          type: "array"
          description: "An array of ancestors that can embed the frame. Include the domain where the envelope will be embedded and the same URL as messageOrigins."
          items:
            type: "string"
        messageOrigins:
          type: "array"
          description: "The originating domain for the signature request message"
          items:
            type: "string"

    #@overlay/match missing_ok=True
    AddDocusignEnvelopesRequest:
      type: "object"
      properties:
        emailSubject:
          type: "string"
          description: "The subject line of the email message that is sent to all recipients"
        environment:
          $ref: "#/components/schemas/DocusignEnvironment"
        status:
          $ref: "#/components/schemas/DocusignEnvelopeStatus"
        signers:
          type: "array"
          description: "List of DocuSign Signers"
          items:
            $ref: "#/components/schemas/DocusignSigner"
        inpersonSigners:
          type: "array"
          description: "List of DocuSign Inperson Signers"
          items:
            $ref: "#/components/schemas/DocusignInpersonSigner"
        notification:
          $ref: "#/components/schemas/DocusignNotification"

    #@overlay/match missing_ok=True
    DocusignNotification:
      properties:
        useAccountDefaults:
          type: "string"
          description: "When true, the account default notification settings are used for the envelope, overriding the reminders and expirations settings. When false, the reminders and expirations settings specified in this request are used. The default value is false."
        expirations:
          $ref: "#/components/schemas/DocusignNotificationExpirations"
        reminders:
          $ref: "#/components/schemas/DocusignNotificationReminders"

    #@overlay/match missing_ok=True
    DocusignNotificationExpirations:
      properties:
        expireAfter:
          type: "string"
          description: "An integer that sets the number of days the envelope is active. For this value to be used, expireEnabled must be explicitly set to true."
        expireEnabled:
          type: "string"
          description: "When true, the envelope expires in the number of days set by expireAfter."
        expireWarn:
          type: "string"
          description: "An integer that specifying the number of days before the envelope expires that an expiration warning email is sent to the recipient."

    #@overlay/match missing_ok=True
    DocusignNotificationReminders:
      properties:
        reminderDelay:
          type: "string"
          description: "An integer specifying the number of days after the recipient receives the envelope that reminder emails are sent to the recipient."
        reminderEnabled:
          type: "string"
          description: "When true, reminders are enabled. The default value is false."
        reminderFrequency:
          type: "string"
          description: "An integer specifying the interval in days between reminder emails."

    #@overlay/match missing_ok=True
    DocusignSigner:
      required:
        - "name"
      type: "object"
      properties:
        name:
          type: "string"
          description: "Name of Signer"
        email:
          type: "string"
          description: "Email of Signer"
        clientUserId:
          type: "string"
          description: "Specifies unique identifier for signer"
        embeddedRecipientStartUrl:
          type: "string"
          enum:
            - "SIGN_AT_DOCUSIGN"
          description: >-
            Enables a Docusign signing invitation while retaining embedded signing
            through clientUserId. Requires clientUserId. When omitted, the existing
            signing behavior is unchanged. Hybrid recipients do not receive automated
            reminders or expiration notifications.
        recipientId:
          type: "string"
          description: "A reference used to map recipients to other objects, such as specific document tabs."
        routingOrder:
          type: "string"
          description: "Specifies the routing order of the recipient in the envelope."
        suppressEmails:
          type: "string"
          description: "When true, email notifications are suppressed for the recipient, and they must access envelopes and documents from their Docusign inbox."
        readyToSignNotification:
          $ref: "#/components/schemas/DocusignSignerReadyToSignNotification"
        tabs:
          $ref: "#/components/schemas/DocusignSigningTabs"

    #@overlay/match missing_ok=True
    DocusignSignerReadyToSignNotification:
      type: "object"
      description: >-
        Configuration for a FormKiQ-managed notification stored with status WAITING
        when the envelope is created. The Docusign recipient-completed callback for
        the immediately preceding signer in routing order releases it to PENDING.
        The callback updates the existing document notification without creating
        a separate user notification record. The notification is addressed to this
        signer's email address and does not require suppressEmails to be enabled.
        Requires a configured connectUrl, unique recipient IDs and unique positive integer routing orders
        for all signers, and at least one preceding signer. Only sequential signing
        is supported when readyToSignNotification is configured; parallel routing
        orders are rejected.
      required:
        - "notificationType"
        - "subject"
        - "body"
      properties:
        notificationType:
          $ref: "#/components/schemas/DocumentNotificationType"
        subject:
          type: "string"
          minLength: 1
          description: "Notification subject"
        body:
          type: "string"
          minLength: 1
          description: "Notification body"

    #@overlay/match missing_ok=True
    DocusignSigningTabs:
      type: "object"
      description: >-
        Recipient tabs for both signers and inpersonSigners. Each tab belongs to the containing
        recipient and the document or artifact selected by this endpoint; FormKiQ assigns DocuSign
        documentId "1". Per-tab recipientId and documentId overrides are unsupported. Supported
        collections are signHereTabs, initialHereTabs, dateSignedTabs, dateTabs, and textTabs.
        Checkboxes, radio groups, dropdowns, name/email/company/title/number fields, conditional
        fields, formulas, attachments, payments, approve/decline controls, and other collections are
        not supported by this contract. Unknown collections and properties are ignored during request
        deserialization, consistent with other FormKiQ requests. Supported field values and placement
        are validated after deserialization. Existing signature properties retain their types and
        optionality.
        Completed field-value retrieval is outside this request contract. Support tracking:
        https://github.com/formkiq/formkiq-platform/issues/277.
      properties:
        signHereTabs:
          type: "array"
          description: "Signature fields; preserves the existing signature request format."
          items:
            $ref: "#/components/schemas/DocusignSignHereTabs"
        initialHereTabs:
          type: "array"
          description: "Recipient initials."
          items:
            $ref: "#/components/schemas/DocusignInitialHereTab"
        dateSignedTabs:
          type: "array"
          description: "Automatic signing dates."
          items:
            $ref: "#/components/schemas/DocusignDateSignedTab"
        dateTabs:
          type: "array"
          description: "Recipient-entered dates."
          items:
            $ref: "#/components/schemas/DocusignDateTab"
        textTabs:
          type: "array"
          description: "Single-line or multiline text fields."
          items:
            $ref: "#/components/schemas/DocusignTextTab"

    #@overlay/match missing_ok=True
    DocusignSignHereTabs:
      type: "object"
      properties:
        anchorString:
          type: "string"
          description: "Specifies the string to find in the document and use as the basis for tab placement."
        anchorXOffset:
          type: "string"
          description: "Specifies the X axis location of the tab in anchorUnits relative to the anchorString."
        anchorYOffset:
          type: "string"
          description: "Specifies the Y axis location of the tab in anchorUnits relative to the anchorString."
        anchorIgnoreIfNotPresent:
          type: "string"
          description: "When true, this tab is ignored if the anchorString is not found in the document."
        anchorUnits:
          type: "string"
          description: "Specifies units of the anchorXOffset and anchorYOffset"
        xPosition:
          type: "string"
          description: "This property indicates the horizontal offset of the object on the page"
        yPosition:
          type: "string"
          description: "This property indicates the vertical offset of the object on the page"
        pageNumber:
          type: "string"
          description: "Specifies the page number on which the tab is located"

    #@overlay/match missing_ok=True
    DocusignInitialHereTab:
      type: "object"
      description: >-
        A field for recipient initials. Specify either anchorString (with optional anchor settings)
        or pageNumber, xPosition, and yPosition. Do not combine anchor and coordinate placement.
        Recipient and document assignment are inherited from the containing request.
      oneOf:
        - required:
            - "anchorString"
          not:
            anyOf:
              - required:
                  - "pageNumber"
              - required:
                  - "xPosition"
              - required:
                  - "yPosition"
        - required:
            - "pageNumber"
            - "xPosition"
            - "yPosition"
          not:
            anyOf:
              - required:
                  - "anchorString"
              - required:
                  - "anchorXOffset"
              - required:
                  - "anchorYOffset"
              - required:
                  - "anchorUnits"
              - required:
                  - "anchorIgnoreIfNotPresent"
              - required:
                  - "anchorCaseSensitive"
              - required:
                  - "anchorMatchWholeWord"
      properties:
        anchorString:
          type: "string"
          description: >-
            Text used to locate the tab. Every matching occurrence creates a tab. Use distinct
            anchors for different recipients.
          minLength: 1
        anchorXOffset:
          type: "string"
          description: "Horizontal offset from the anchor in anchorUnits; negative offsets are allowed."
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
        anchorYOffset:
          type: "string"
          description: "Vertical offset from the anchor in anchorUnits; negative offsets are allowed."
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
        anchorUnits:
          type: "string"
          description: "Units for anchor offsets."
          enum:
            - "pixels"
            - "inches"
            - "mms"
            - "cms"
        anchorIgnoreIfNotPresent:
          type: "string"
          description: >-
            When true, omit the tab if its anchor is missing. When false, a missing anchor is an
            error. When omitted, DocuSign defaults apply.
          enum:
            - "true"
            - "false"
        anchorCaseSensitive:
          type: "string"
          description: "Whether anchor matching is case sensitive. When omitted, DocuSign defaults apply."
          enum:
            - "true"
            - "false"
        anchorMatchWholeWord:
          type: "string"
          description: "Whether the anchor must match a whole word. When omitted, DocuSign defaults apply."
          enum:
            - "true"
            - "false"
        pageNumber:
          type: "string"
          description: "One-based page number for coordinate placement."
          pattern: "^[1-9][0-9]*$"
        xPosition:
          type: "string"
          description: "Horizontal position in pixels for coordinate placement."
          pattern: "^[0-9]+$"
        yPosition:
          type: "string"
          description: "Vertical position in pixels for coordinate placement."
          pattern: "^[0-9]+$"
        tabLabel:
          type: "string"
          description: "Field label used to identify the tab."
          minLength: 1
        optional:
          type: "string"
          description: "Whether the recipient may leave the initials field empty."
          enum:
            - "true"
            - "false"
        scaleValue:
          type: "string"
          description: "Positive scaling factor for the initials field."
          pattern: "^(0\\.[0-9]*[1-9][0-9]*|[1-9][0-9]*(\\.[0-9]+)?)$"

    #@overlay/match missing_ok=True
    DocusignDateSignedTab:
      type: "object"
      description: >-
        An automatic signing date populated by DocuSign when the recipient signs. The caller cannot
        set its value. Date and time formatting follow DocuSign account settings. Specify either
        anchorString (with optional anchor settings) or pageNumber, xPosition, and yPosition. Do not
        combine anchor and coordinate placement. Recipient and document assignment are inherited
        from the containing request.
      oneOf:
        - required:
            - "anchorString"
          not:
            anyOf:
              - required:
                  - "pageNumber"
              - required:
                  - "xPosition"
              - required:
                  - "yPosition"
        - required:
            - "pageNumber"
            - "xPosition"
            - "yPosition"
          not:
            anyOf:
              - required:
                  - "anchorString"
              - required:
                  - "anchorXOffset"
              - required:
                  - "anchorYOffset"
              - required:
                  - "anchorUnits"
              - required:
                  - "anchorIgnoreIfNotPresent"
              - required:
                  - "anchorCaseSensitive"
              - required:
                  - "anchorMatchWholeWord"
      properties:
        anchorString:
          type: "string"
          description: >-
            Text used to locate the tab. Every matching occurrence creates a tab. Use distinct
            anchors for different recipients.
          minLength: 1
        anchorXOffset:
          type: "string"
          description: "Horizontal offset from the anchor in anchorUnits; negative offsets are allowed."
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
        anchorYOffset:
          type: "string"
          description: "Vertical offset from the anchor in anchorUnits; negative offsets are allowed."
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
        anchorUnits:
          type: "string"
          description: "Units for anchor offsets."
          enum:
            - "pixels"
            - "inches"
            - "mms"
            - "cms"
        anchorIgnoreIfNotPresent:
          type: "string"
          description: >-
            When true, omit the tab if its anchor is missing. When false, a missing anchor is an
            error. When omitted, DocuSign defaults apply.
          enum:
            - "true"
            - "false"
        anchorCaseSensitive:
          type: "string"
          description: "Whether anchor matching is case sensitive. When omitted, DocuSign defaults apply."
          enum:
            - "true"
            - "false"
        anchorMatchWholeWord:
          type: "string"
          description: "Whether the anchor must match a whole word. When omitted, DocuSign defaults apply."
          enum:
            - "true"
            - "false"
        pageNumber:
          type: "string"
          description: "One-based page number for coordinate placement."
          pattern: "^[1-9][0-9]*$"
        xPosition:
          type: "string"
          description: "Horizontal position in pixels for coordinate placement."
          pattern: "^[0-9]+$"
        yPosition:
          type: "string"
          description: "Vertical position in pixels for coordinate placement."
          pattern: "^[0-9]+$"
        tabLabel:
          type: "string"
          description: "Field label used to identify the tab."
          minLength: 1
        font:
          type: "string"
          description: "DocuSign font name."
        fontSize:
          type: "string"
          description: "DocuSign font size, for example Size12."
        fontColor:
          type: "string"
          description: "DocuSign font color name, for example Black."
        bold:
          type: "string"
          description: "Whether the field text is bold."
          enum:
            - "true"
            - "false"
        italic:
          type: "string"
          description: "Whether the field text is italic."
          enum:
            - "true"
            - "false"
        underline:
          type: "string"
          description: "Whether the field text is underlined."
          enum:
            - "true"
            - "false"

    #@overlay/match missing_ok=True
    DocusignDateTab:
      type: "object"
      description: >-
        A single-line date entered by the recipient, distinct from the automatic signing date.
        Document any required date format using validationPattern and validationMessage; use a
        validated text tab when strict date-format enforcement is needed. Specify either
        anchorString (with optional anchor settings) or pageNumber, xPosition, and yPosition. Do not
        combine anchor and coordinate placement. Recipient and document assignment are inherited
        from the containing request.
      oneOf:
        - required:
            - "anchorString"
          not:
            anyOf:
              - required:
                  - "pageNumber"
              - required:
                  - "xPosition"
              - required:
                  - "yPosition"
        - required:
            - "pageNumber"
            - "xPosition"
            - "yPosition"
          not:
            anyOf:
              - required:
                  - "anchorString"
