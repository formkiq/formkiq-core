        - status
      properties:
        envelopeId:
          type: string
          description: Identifier of the DocuSign envelope that was voided
          example: a1111111-b222-c333-d444-e55555555555
        status:
          type: string
          description: Envelope status after the successful operation, voided
          example: voided

    #@overlay/match missing_ok=True
    AddDocusignEnvelopesResponse:
      type: "object"
      properties:
        envelopeId:
          type: "string"
          description: "Docusign Envelope Identifier"

