        For targeted reminders, recipients contains exactly one outcome for each
        requested recipient ID. HTTP 200 can include accepted and failed outcomes,
        including when every recipient failed at the provider after validation.
        Invalid selections detected before the resend return 400 instead.
        Envelope-wide acceptance returns an empty object; do not infer individual
        outcomes. There is no overall status field. Authentication, validation,
        rate-limit, upstream, and timeout errors use the documented 4xx/5xx responses.
      properties:
        recipients:
          type: array
          minItems: 1
          description: >-
            Outcomes for the selected recipients, present for targeted requests
            and omitted for envelope-wide reminders. A timeout or missing provider
            outcome must not be represented as confirmed acceptance or failure.
          items:
            $ref: '#/components/schemas/DocusignReminderRecipient'

    #@overlay/match missing_ok=True
    DocusignReminderRecipient:
      type: object
      additionalProperties: false
      required:
        - recipientId
        - status
      properties:
        recipientId:
          type: string
          description: Selected DocuSign signer ID from the request
          example: '1'
        status:
          type: string
          description: >-
            accepted means DocuSign accepted the reminder request for this
            recipient, not confirmed delivery. failed means DocuSign returned
            a definitive recipient-level failure.
          example: accepted
        message:
          type: string
          description: Explanation of a recipient-level failure, when available
          example: Recipient is no longer eligible for a reminder.

    #@overlay/match missing_ok=True
    VoidDocusignEnvelopeRequest:
      type: object
      required:
        - voidedReason
      properties:
        voidedReason:
          type: string
          minLength: 1
          pattern: '\S'
          maxLength: 200
          description: >-
            Non-blank, recipient-facing explanation for voiding the DocuSign
            envelope. At most 200 characters, including spaces and line breaks;
            longer reasons are rejected without truncation.
          example: Document has been replaced.

    #@overlay/match missing_ok=True
    VoidDocusignEnvelopeResponse:
      type: object
      required:
