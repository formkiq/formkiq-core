#@ load("@ytt:overlay", "overlay")
#@overlay/match by=overlay.all
---
paths:
  #@overlay/match missing_ok=True
  /esignature/docusign/{documentId}/envelopes:
    post:
      operationId: AddDocusignEnvelopes
      summary: Create Docusign Envelope request
      description: >-
        Create a DocuSign envelope for the selected document or artifact; available
        as an Add-On Module. Recipient tabs support signatures, initials, automatic
        signing dates, recipient-entered dates, and single-line or multiline text.
        See DocusignSigningTabs for the supported collections and validation rules.
      tags:
        - E-Signature
      parameters:
        - $ref: '#/components/parameters/siteIdParam'
        - $ref: '#/components/parameters/documentIdParam'
        - $ref: '#/components/parameters/artifactIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDocusignEnvelopesRequest'
            examples:
              signatureDateAndText:
                summary: "Signature, automatic signing date, and multiline text"
                value:
                  emailSubject: "Please review and sign"
                  environment: "DEVELOPMENT"
                  status: "sent"
                  signers:
                    - name: "Jane Smith"
                      email: "signer1@example.com"
                      recipientId: "1"
                      routingOrder: "1"
                      tabs:
                        signHereTabs:
                          - anchorString: "signature1"
                        dateSignedTabs:
                          - anchorString: "date1"
                            tabLabel: "signedOn"
                            anchorIgnoreIfNotPresent: "false"
                        textTabs:
                          - anchorString: "text1"
                            tabLabel: "comments"
                            anchorIgnoreIfNotPresent: "false"
                            width: "300"
                            height: "80"
                            maxLength: "1000"
                            required: "true"
              coordinatePlacement:
                summary: "Signature and editable date placed on the first page"
                value:
                  emailSubject: "Please review and sign"
                  environment: "DEVELOPMENT"
                  status: "sent"
                  signers:
                    - name: "Jane Smith"
                      email: "signer1@example.com"
                      recipientId: "1"
                      routingOrder: "1"
                      tabs:
                        signHereTabs:
                          - pageNumber: "1"
                            xPosition: "100"
                            yPosition: "400"
                        dateTabs:
                          - pageNumber: "1"
                            xPosition: "300"
                            yPosition: "400"
                            tabLabel: "effectiveDate"
                            required: "true"
                            width: "100"
              multipleRecipients:
                summary: "Distinct signature and date anchors for two sequential recipients"
                value:
                  emailSubject: "Please review and sign"
                  environment: "DEVELOPMENT"
                  status: "sent"
                  signers:
                    - name: "Jane Smith"
                      email: "signer1@example.com"
                      recipientId: "1"
                      routingOrder: "1"
                      tabs:
                        signHereTabs:
                          - anchorString: "signature1"
                        dateSignedTabs:
                          - anchorString: "date1"
                            anchorIgnoreIfNotPresent: "false"
                    - name: "John Smith"
                      email: "signer2@example.com"
                      recipientId: "2"
                      routingOrder: "2"
                      tabs:
                        signHereTabs:
                          - anchorString: "signature2"
                        dateSignedTabs:
                          - anchorString: "date2"
                            anchorIgnoreIfNotPresent: "false"
              inpersonSigning:
                summary: "Hosted signing with signature, initials, and an automatic date"
                value:
                  emailSubject: "Please review and sign"
                  environment: "DEVELOPMENT"
                  status: "sent"
                  inpersonSigners:
                    - hostName: "Alex Host"
                      hostEmail: "host@example.com"
                      signerName: "Jane Smith"
                      recipientId: "1"
                      routingOrder: "1"
                      tabs:
                        signHereTabs:
                          - anchorString: "signature1"
                        initialHereTabs:
                          - anchorString: "initial1"
                            optional: "false"
                        dateSignedTabs:
                          - anchorString: "date1"
      responses:
        '200':
          description: 200 OK
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
            Access-Control-Allow-Methods:
              $ref: '#/components/headers/AccessControlAllowMethods'
            Access-Control-Allow-Headers:
              $ref: '#/components/headers/AccessControlAllowHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddDocusignEnvelopesResponse'
        '400':
          description: Invalid envelope request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorsResponse'
              examples:
                invalidTabProperty:
                  summary: "Invalid text field width"
                  value:
                    errors:
                      - key: "signers[0].tabs.textTabs[0].width"
                        error: "Property must be a positive integer"
                invalidTabPlacement:
                  summary: "Missing text field placement"
                  value:
                    errors:
                      - key: "signers[0].tabs.textTabs[0]"
                        error: "Specify either anchorString with anchor options or pageNumber, xPosition and yPosition"
      security:
      - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/esignatureLambdaApi200"

  #@overlay/match missing_ok=True
  /esignature/docusign/{documentId}/envelopes/{envelopeId}:
    get:
      operationId: GetDocusignEnvelope
      summary: Get Docusign envelope and recipient status
      description: >-
        Retrieves the DocuSign envelope using include=recipients and returns the
        DocuSign response directly, including envelope status and recipient routing
        information. No FormKiQ fields or wrapper are added. The envelope must be
        associated with the selected document or artifact. This read-only operation
        does not update document attributes or download the signed document.
        Available as an Add-On Module. Repeated status polling must be at least
        15 minutes apart. Use recipients.signers[].recipientId from this
        response as entries in the optional recipientIds array in
        POST /esignature/docusign/{documentId}/envelopes/{envelopeId}/reminders
        to request reminders for selected signers.
      tags:
        - E-Signature
      parameters:
        - $ref: '#/components/parameters/siteIdParam'
        - $ref: '#/components/parameters/documentIdParam'
        - $ref: '#/components/parameters/artifactIdParam'
        - $ref: '#/components/parameters/docusignEnvelopeIdParam'
        - name: environment
          in: query
          required: false
          description: >-
            DocuSign environment. Defaults to the site's docusignEnvironment;
            required when the site has no default. Use the environment in which
            the envelope was created.
          schema:
            $ref: '#/components/schemas/DocusignEnvironment'
      responses:
        '200':
          description: DocuSign envelope with recipients
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
            Access-Control-Allow-Methods:
              $ref: '#/components/headers/AccessControlAllowMethods'
            Access-Control-Allow-Headers:
              $ref: '#/components/headers/AccessControlAllowHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDocusignEnvelopeResponse'
              example:
                envelopeId: a1111111-b222-c333-d444-e55555555555
                status: sent
                recipients:
                  recipientCount: '3'
                  currentRoutingOrder: '2'
                  signers:
                    - recipientId: '1'
                      name: Alice
                      email: alice@example.com
                      routingOrder: '1'
                      status: completed
                    - recipientId: '2'
                      name: Bob
                      email: bob@example.com
                      routingOrder: '2'
                      status: delivered
                    - recipientId: '3'
                      name: Carol
                      email: carol@example.com
                      routingOrder: '3'
                      status: created
        '400':
          description: Invalid parameters or missing DocuSign configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorsResponse'
        '401':
          description: Authentication required
        '403':
          description: Access to the selected document or artifact is denied
        '404':
          description: Document, artifact, or associated DocuSign envelope not found
        '429':
          description: Envelope polling or DocuSign rate limit exceeded
          headers:
            Retry-After:
              description: Seconds to wait before another lookup
              schema:
                type: integer
                minimum: 0
        '502':
          description: DocuSign authentication failure, upstream error, or invalid response
        '504':
          description: DocuSign request timed out
      security:
      - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/esignatureLambdaApi200"

  #@overlay/match missing_ok=True
  /esignature/docusign/{documentId}/envelopes/{envelopeId}/reminders:
    post:
      operationId: AddDocusignEnvelopeReminders
      summary: Request DocuSign signing reminders
      description: >-
        Resends signing notifications for an in-progress DocuSign envelope;
        available as an Add-On Module. With no request body or an empty object,
        DocuSign reminds all eligible recipients at the current routing step.
        Supply recipientIds to remind only the selected eligible signers. Obtain IDs
        from recipients.signers[].recipientId in
        GET /esignature/docusign/{documentId}/envelopes/{envelopeId}.
        Every selected signer must still be awaiting action at the current routing
        step when this request is processed. Validate the entire selection before
        issuing a resend. Completed and future-step signers
        cannot be targeted. Invalid targeted requests never fall back to reminding
        all recipients. Recipient notification settings are respected; this
        operation does not send FormKiQ notifications to embedded-only or
        email-suppressed signers. Requires write access to the selected document
        or artifact and a matching stored envelope ID. The operation resends the
        existing invitation without changing recipients, documents, routing,
        or automatic reminder settings. Targeted responses report each
        selected recipient's acceptance or failure, with no overall status.
        Acceptance does not confirm notification delivery. Do not automatically
        retry after a timeout
        because the reminder may already have been requested.
      tags:
        - E-Signature
      parameters:
        - $ref: '#/components/parameters/siteIdParam'
        - $ref: '#/components/parameters/documentIdParam'
        - $ref: '#/components/parameters/artifactIdParam'
        - $ref: '#/components/parameters/docusignEnvelopeIdParam'
        - name: environment
          in: query
          required: false
          description: >-
            DocuSign environment. Defaults to the site's docusignEnvironment;
            required when the site has no default. Use the environment in which
            the envelope was created.
          schema:
            $ref: '#/components/schemas/DocusignEnvironment'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDocusignEnvelopeRemindersRequest'
            examples:
              allCurrentRecipients:
                summary: Remind all eligible current recipients
                value: {}
              selectedSigner:
                summary: Remind one signer identified by the GET envelope response
                value:
                  recipientIds: ['2']
              selectedSigners:
                summary: Remind multiple signers sharing the current routing step
                value:
                  recipientIds: ['2', '3']
      responses:
        '200':
          description: >-
            Reminder request processed. For targeted requests, inspect each entry
            in recipients for acceptance or failure; HTTP 200 does not mean all
            selected recipients succeeded. An envelope-wide request returns an
            empty object when DocuSign accepts it, because individual recipient
            outcomes are not returned. Acceptance does not confirm delivery.
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
            Access-Control-Allow-Methods:
              $ref: '#/components/headers/AccessControlAllowMethods'
            Access-Control-Allow-Headers:
              $ref: '#/components/headers/AccessControlAllowHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddDocusignEnvelopeRemindersResponse'
              examples:
                selectedRecipients:
                  summary: One reminder accepted and one failed after validation
                  value:
                    recipients:
                      - recipientId: '1'
                        status: accepted
                      - recipientId: '2'
                        status: failed
                        message: Recipient is no longer eligible for a reminder.
                envelopeWide:
                  summary: Envelope-wide reminder accepted without individual outcomes
                  value: {}
        '400':
          description: >-
            Invalid parameters, missing DocuSign configuration, ineligible envelope
            state, or unknown or ineligible signers. Null or empty recipientIds arrays,
            duplicate IDs, and null, blank, or non-string entries are rejected.
            The singular recipientId field is not accepted. Draft and terminal
            envelopes cannot be reminded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorsResponse'
        '401':
          description: Authentication required
        '403':
          description: Write access to the selected document or artifact is denied
        '404':
          description: Document, artifact, or associated DocuSign envelope not found
        '429':
          description: DocuSign rate limit exceeded
        '502':
          description: DocuSign authentication failure, upstream error, or invalid response
        '504':
          description: DocuSign request timed out; reminder delivery outcome is unknown
      security:
      - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/esignatureLambdaApi200"

  #@overlay/match missing_ok=True
  /esignature/docusign/{documentId}/envelopes/{envelopeId}/void:
    post:
      operationId: VoidDocusignEnvelope
      summary: Void a DocuSign envelope
      description: >-
        Cancels an in-progress DocuSign envelope; available as an Add-On Module.
        Requires write access to the selected document or artifact and a matching
        stored envelope ID. Calls DocuSign's envelope update API,
        PUT /restapi/v2.1/accounts/{accountId}/envelopes/{envelopeId}, with
        status set to voided and the supplied voidedReason. DocuSign notifies
        recipients that the envelope was voided, including the supplied reason.
        Only sent or delivered envelopes can be voided. If the envelope is already
        voided, returns its current state without another update or changing its
        original reason. Voiding cannot be undone. The existing envelope-voided
        callback updates the stored FormKiQ status. After a timeout, the
        outcome is unknown; check the existing GET envelope status endpoint
        before attempting the operation again.
      externalDocs:
        description: DocuSign Envelopes update API
        url: https://developers.docusign.com/docs/esign-rest-api/reference/envelopes/envelopes/update/
      tags:
        - E-Signature
      parameters:
        - $ref: '#/components/parameters/siteIdParam'
        - $ref: '#/components/parameters/documentIdParam'
        - $ref: '#/components/parameters/artifactIdParam'
        - $ref: '#/components/parameters/docusignEnvelopeIdParam'
        - name: environment
          in: query
          required: false
          description: >-
            DocuSign environment. Defaults to the site's docusignEnvironment;
            required when the site has no default. Use the environment in which
            the envelope was created.
          schema:
            $ref: '#/components/schemas/DocusignEnvironment'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoidDocusignEnvelopeRequest'
            example:
              voidedReason: Document has been replaced.
      responses:
        '200':
          description: DocuSign envelope voided successfully
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
            Access-Control-Allow-Methods:
              $ref: '#/components/headers/AccessControlAllowMethods'
            Access-Control-Allow-Headers:
              $ref: '#/components/headers/AccessControlAllowHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoidDocusignEnvelopeResponse'
              example:
                envelopeId: a1111111-b222-c333-d444-e55555555555
                status: voided
        '400':
          description: >-
            Invalid parameters, missing, blank, or overlong voidedReason, missing DocuSign
            configuration, or an envelope that is not eligible to be voided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorsResponse'
        '401':
          description: Authentication required
        '403':
          description: Write access to the selected document or artifact is denied
        '404':
          description: Document, artifact, or associated DocuSign envelope not found
        '429':
          description: DocuSign rate limit exceeded
        '502':
          description: DocuSign authentication failure, upstream error, or invalid response
        '504':
          description: DocuSign request timed out; the void operation outcome is unknown
      security:
      - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/esignatureLambdaApi200"

  #@overlay/match missing_ok=True
  /esignature/docusign/{documentId}/envelopes/{envelopeId}/views/recipient:
    post:
      operationId: AddDocusignRecipientView
      summary: Create Docusign Recipient View request
      description: DocuSign create Docusign Recipient View request; available as an Add-On Module
      tags:
        - E-Signature
      parameters:
        - $ref: '#/components/parameters/siteIdParam'
        - $ref: '#/components/parameters/documentIdParam'
        - $ref: '#/components/parameters/artifactIdParam'
        - $ref: '#/components/parameters/docusignEnvelopeIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDocusignRecipientViewRequest'
      responses:
        '200':
          description: 200 OK
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
            Access-Control-Allow-Methods:
              $ref: '#/components/headers/AccessControlAllowMethods'
            Access-Control-Allow-Headers:
              $ref: '#/components/headers/AccessControlAllowHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddDocusignRecipientViewResponse'
        '400':
          description: 400 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorsResponse'
      security:
      - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/esignatureLambdaApi200"

  #@overlay/match missing_ok=True
  /esignature/docusign/{documentId}/envelopes/{envelopeId}/views/sender:
    post:
      operationId: AddDocusignSenderView
      summary: Create Docusign Sender View request
      description: DocuSign create Docusign Sender View request; available as an Add-On Module
      tags:
        - E-Signature
      parameters:
        - $ref: '#/components/parameters/siteIdParam'
        - $ref: '#/components/parameters/documentIdParam'
        - $ref: '#/components/parameters/artifactIdParam'
        - $ref: '#/components/parameters/docusignEnvelopeIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDocusignSenderViewRequest'
            example:
              returnUrl: https://console.example.com/agreements/123/esignature
      responses:
        '200':
          description: 200 OK
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
            Access-Control-Allow-Methods:
              $ref: '#/components/headers/AccessControlAllowMethods'
            Access-Control-Allow-Headers:
              $ref: '#/components/headers/AccessControlAllowHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddDocusignSenderViewResponse'
              example:
                viewUrl: https://...
        '400':
          description: 400 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorsResponse'
      security:
      - ApiAuthorization: []
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/esignatureLambdaApi200"

  #@overlay/match missing_ok=True
  /esignature/docusign/events:
    post:
      operationId: AddEsignatureDocusignEvents
      summary: Add E-signature event
      description: DocuSign callback URL handler; available as an Add-On Module
      tags:
        - E-Signature
      responses:
        '200':
          description: 200 OK
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
            Access-Control-Allow-Methods:
              $ref: '#/components/headers/AccessControlAllowMethods'
            Access-Control-Allow-Headers:
              $ref: '#/components/headers/AccessControlAllowHeaders'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddResponse'
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/esignatureLambdaApi200"

components:
  schemas:
    #@overlay/match missing_ok=True
    DocusignEnvironment:
      type: string
      description: "Docusign environment. When omitted from an E-Signature request, defaults to docusignEnvironment in the site configuration."
      enum:
        - PRODUCTION
        - DEVELOPMENT

    #@overlay/match missing_ok=True
    DocusignEnvelopeStatus:
      type: "string"
      description: |-
        Controls how the envelope is created:
        * `created` saves the envelope as a draft without notifying recipients.
        * `sent` immediately sends the envelope to recipients.
      enum:
        - created
        - sent
      default: sent

    #@overlay/match missing_ok=True
    DocusignRecipientView:
      type: "object"
      properties:
        returnUrl:
          type: "string"
          description: "Identifies the return point after sending the envelope"
        recipientId:
          type: "string"
          description: "A reference used to map recipients to other objects, such as specific document tabs."
        userName:
          type: "string"
          description: "The username of the recipient. You can use either email and userName."
        clientUserId:
          type: "string"
          description: "Specifies unique identifier for signer"
        email:
          type: "string"
          description: "Specifies the email of the recipient"
        frameAncestors:
          type: "array"
          description: "An array of ancestors that can embed the frame. Include the domain where the envelope will be embedded and the same URL as messageOrigins."
          items:
            type: "string"
        messageOrigins:
          type: "array"
          description: "The originating domain for the signature request message"
          items:
            type: "string"

    #@overlay/match missing_ok=True
    AddDocusignEnvelopesRequest:
      type: "object"
      properties:
        emailSubject:
          type: "string"
          description: "The subject line of the email message that is sent to all recipients"
        environment:
          $ref: "#/components/schemas/DocusignEnvironment"
        status:
          $ref: "#/components/schemas/DocusignEnvelopeStatus"
        signers:
          type: "array"
          description: "List of DocuSign Signers"
          items:
            $ref: "#/components/schemas/DocusignSigner"
        inpersonSigners:
          type: "array"
          description: "List of DocuSign Inperson Signers"
          items:
            $ref: "#/components/schemas/DocusignInpersonSigner"
        notification:
          $ref: "#/components/schemas/DocusignNotification"

    #@overlay/match missing_ok=True
    DocusignNotification:
      properties:
        useAccountDefaults:
          type: "string"
          description: "When true, the account default notification settings are used for the envelope, overriding the reminders and expirations settings. When false, the reminders and expirations settings specified in this request are used. The default value is false."
        expirations:
          $ref: "#/components/schemas/DocusignNotificationExpirations"
        reminders:
          $ref: "#/components/schemas/DocusignNotificationReminders"

    #@overlay/match missing_ok=True
    DocusignNotificationExpirations:
      properties:
        expireAfter:
          type: "string"
          description: "An integer that sets the number of days the envelope is active. For this value to be used, expireEnabled must be explicitly set to true."
        expireEnabled:
          type: "string"
          description: "When true, the envelope expires in the number of days set by expireAfter."
        expireWarn:
          type: "string"
          description: "An integer that specifying the number of days before the envelope expires that an expiration warning email is sent to the recipient."

    #@overlay/match missing_ok=True
    DocusignNotificationReminders:
      properties:
        reminderDelay:
          type: "string"
          description: "An integer specifying the number of days after the recipient receives the envelope that reminder emails are sent to the recipient."
        reminderEnabled:
          type: "string"
          description: "When true, reminders are enabled. The default value is false."
        reminderFrequency:
          type: "string"
          description: "An integer specifying the interval in days between reminder emails."

    #@overlay/match missing_ok=True
    DocusignSigner:
      required:
        - "name"
      type: "object"
      properties:
        name:
          type: "string"
          description: "Name of Signer"
        email:
          type: "string"
          description: "Email of Signer"
        clientUserId:
          type: "string"
          description: "Specifies unique identifier for signer"
        embeddedRecipientStartUrl:
          type: "string"
          enum:
            - "SIGN_AT_DOCUSIGN"
          description: >-
            Enables a Docusign signing invitation while retaining embedded signing
            through clientUserId. Requires clientUserId. When omitted, the existing
            signing behavior is unchanged. Hybrid recipients do not receive automated
            reminders or expiration notifications.
        recipientId:
          type: "string"
          description: "A reference used to map recipients to other objects, such as specific document tabs."
        routingOrder:
          type: "string"
          description: "Specifies the routing order of the recipient in the envelope."
        suppressEmails:
          type: "string"
          description: "When true, email notifications are suppressed for the recipient, and they must access envelopes and documents from their Docusign inbox."
        readyToSignNotification:
          $ref: "#/components/schemas/DocusignSignerReadyToSignNotification"
        tabs:
          $ref: "#/components/schemas/DocusignSigningTabs"

    #@overlay/match missing_ok=True
    DocusignSignerReadyToSignNotification:
      type: "object"
      description: >-
        Configuration for a FormKiQ-managed notification stored with status WAITING
        when the envelope is created. The Docusign recipient-completed callback for
        the immediately preceding signer in routing order releases it to PENDING.
        The callback updates the existing document notification without creating
        a separate user notification record. The notification is addressed to this
        signer's email address and does not require suppressEmails to be enabled.
        Requires a configured connectUrl, unique recipient IDs and unique positive integer routing orders
        for all signers, and at least one preceding signer. Only sequential signing
        is supported when readyToSignNotification is configured; parallel routing
        orders are rejected.
      required:
        - "notificationType"
        - "subject"
        - "body"
      properties:
