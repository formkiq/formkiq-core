ApiAuthorization:
  type: oauth2
  flows: {}
  x-amazon-apigateway-authorizer:
    type: jwt
    jwtConfiguration:
      issuer:
        Fn::Sub: https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${CognitoUserPool}
      audience:
        - Fn::Sub: "${CognitoUserPoolClient}"
        - Fn::If:
            - HasCognitoAdditionalAppClientId
            - Ref: CognitoAdditionalAppClientId
            - Ref: AWS::NoValue
    identitySource: "$request.header.Authorization"
