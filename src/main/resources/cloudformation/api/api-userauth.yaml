#@ load("@ytt:data", "data")
#@ load("@ytt:assert", "assert")
---
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: FormKiQ User Auth API
    
Parameters:
              
  AppEnvironment:
    Type: String
    AllowedPattern: ".+"
    Description: The FormKiQ Environment

  DocumentsApiRequestsArn:
    Description: Lambda to invoke
    Type: String

  CognitoUserPool:
    Type: String
    Description: The Cognito User Pool Id

  CognitoUserPoolClient:
    Type: String
    Description: The Cognito User Pool Client Id

  CertificateStackNameUserAuthApiDomain:
    Type: String
    Description: Certificate User Auth Api Domain

  CertificateStackNameUserAuthCertificateArn:
    Type: String
    Description: Certificate User Auth API ACM Certificate ARN
    Default: ""

  CertificateStackNameHostedZoneId:
    Type: String
    Description: Optional Route53 hosted zone for the User Auth API domain
    Default: ""

Conditions:

  HasCertificateStackNameUserAuthCertificateArn:
    Fn::Not:
      - Fn::Or:
          - Fn::Equals:
              - Ref: CertificateStackNameUserAuthCertificateArn
              - ""
          - Fn::Equals:
              - Ref: CertificateStackNameUserAuthCertificateArn
              - "_"

  HasCertificateStackNameHostedZoneId:
    Fn::Not:
      - Fn::Or:
          - Fn::Equals:
              - Ref: CertificateStackNameHostedZoneId
              - ""
          - Fn::Equals:
              - Ref: CertificateStackNameHostedZoneId
              - "_"

  CanCreateUserAuthApiDomainName:
    Fn::And:
      - Condition: HasCertificateStackNameUserAuthApiDomain
      - Condition: HasCertificateStackNameUserAuthCertificateArn

  CanCreateUserAuthApiARecord:
    Fn::And:
      - Condition: CanCreateUserAuthApiDomainName
      - Condition: HasCertificateStackNameHostedZoneId

  HasCertificateStackNameUserAuthApiDomain:
    Fn::Not:
      - Fn::Or:
          - Fn::Equals:
              - Ref: CertificateStackNameUserAuthApiDomain
              - ""
          - Fn::Equals:
              - Ref: CertificateStackNameUserAuthApiDomain
              - "_"

Resources:

  AuthApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      FailOnWarnings: "true"

  UserAuthApiDomainName:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: CanCreateUserAuthApiDomainName
    Properties:
      DomainName:
        Ref: CertificateStackNameUserAuthApiDomain
      DomainNameConfigurations:
        - CertificateArn:
            Ref: CertificateStackNameUserAuthCertificateArn

  UserAuthApiDomainNameRoute53RecordSetGroup:
    Type: AWS::Route53::RecordSet
    Condition: CanCreateUserAuthApiARecord
    Properties:
      Name:
        Ref: UserAuthApiDomainName
      Type: A
      HostedZoneId:
        Ref: CertificateStackNameHostedZoneId
      AliasTarget:
        DNSName:
          Fn::GetAtt:
            - UserAuthApiDomainName
            - RegionalDomainName
        EvaluateTargetHealth: false
        HostedZoneId:
          Fn::GetAtt:
            - UserAuthApiDomainName
            - RegionalHostedZoneId

Outputs:
  UserAuthApi:
    Description: User Auth API
    Value:
      Ref: AuthApi
  UserAuthApiUrl:
    Description: "The endpoint url for the User Auth API"
    Value:
      Fn::If:
        - CanCreateUserAuthApiDomainName
        - Fn::Join:
            - ''
            - - 'https://'
              - Ref: CertificateStackNameUserAuthApiDomain
        - Fn::Sub: "https://${AuthApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
