name: S3 Dev Deployment

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The FormKiQ version number string to deploy.'
        required: true
      architecture:
        description: 'Distribution architecture'
        type: choice
        required: true
        default: x86_64
        options:
          - x86_64
          - arm64
      aws-region:
        description: 'AWS region to deploy to'
        type: choice
        options:
          - us-east-1
          - us-east-2
          - us-west-2
          - ap-northeast-2
          - ap-south-1
          - ap-southeast-1
          - ap-southeast-2
          - ca-central-1
          - ca-west-1
          - eu-central-1
          - eu-west-1
          - eu-west-3
          - sa-east-1
        default: 'us-east-2'

permissions:
  contents: read
  id-token: write

jobs:
  build:

    runs-on: ubuntu-24.04
    env:
      LAMBDA_ARCHITECTURE: ${{ inputs.architecture }}

    steps:
    - uses: actions/checkout@v5
    - name: Set AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        role-session-name: formkiq-core-deployment-dev
        aws-region: ${{ github.event.inputs.aws-region }}
        retry-max-attempts: 3
    - name: Publish selected architecture to regional S3 buckets
      env:
        S3_BUCKET: ${{ secrets.S3_BUCKET }}
        FORMKIQ_VERSION: ${{ inputs.version }}
        LAMBDA_ARCHITECTURE: ${{ inputs.architecture }}
        SELECTED_AWS_REGION: ${{ inputs['aws-region'] }}
      run: bash scripts/publish-aws-cloud.sh "$FORMKIQ_VERSION" "$LAMBDA_ARCHITECTURE" "$SELECTED_AWS_REGION"
