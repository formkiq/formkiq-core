name: S3 Deployment

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The FormKiQ version number string to deploy.'
        required: true
      architecture:
        description: 'Distribution architecture'
        type: choice
        required: true
        default: arm64
        options:
          - arm64
          - x86_64

permissions:
  contents: read
  id-token: write

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v5
    - name: Set AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        role-session-name: formkiq-core-deployment
        aws-region: us-east-1
        retry-max-attempts: 3
    - name: Publish architecture-specific release
      env:
        S3_BUCKET: ${{ secrets.S3_BUCKET }}
        FORMKIQ_VERSION: ${{ inputs.version }}
        LAMBDA_ARCHITECTURE: ${{ inputs.architecture }}
        PUBLISH_OPENSEARCH_BASTION: 'true'
      run: >-
        bash scripts/publish-aws-cloud.sh "$FORMKIQ_VERSION" "$LAMBDA_ARCHITECTURE"
        us-east-1
        us-east-2
        ca-central-1
        ca-west-1
        eu-central-1
        ap-south-1
        us-west-2
        sa-east-1
        ap-southeast-2
        ap-northeast-2
        eu-west-1
        eu-west-3
        ap-southeast-1
        eu-west-2
        eu-north-1
        eu-south-1
        af-south-1
        ap-northeast-1
